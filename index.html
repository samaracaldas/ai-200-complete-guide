{id:"t8",num:"08",domain:"data",week:3,title:"Request Units (RUs)",tag:"AI Data · Semana 3",tagColor:"p",
summary:"A moeda de processamento do Cosmos DB. Normaliza CPU + I/O + memória em uma única unidade de custo.",
sections:[
{title:"O que determina o custo e modos de throughput",content:`1 RU: ler item pelo id + partition key (operação mais barata).
Query com índice: ~2–10 RUs.
Query sem índice (full scan): pode ser 100–1000× mais caro!
Cross-partition query: multiplica pelo número de partições físicas.
Insert/Update: 5–20 RUs dependendo do tamanho e quantidade de índices.

Modos de throughput:
Provisioned: você define RU/s fixos. Paga sempre esse valor. Para cargas previsíveis.
Serverless: paga por RU consumida. Sem provisionamento. Para dev/teste e cargas intermitentes. Limite: 5000 RU/s por container.
Autoscale: define o máximo (ex: 4000 RU/s). Escala de 10% a 100% automaticamente. Paga pelo peak da hora. Melhor dos dois mundos para produção.

Erro 429 (TooManyRequests): throughput excedido. O SDK do Cosmos DB faz retry com backoff exponencial automaticamente.`}
],
analogy:"RUs são como fichas de arcade. Point read = 1 ficha. Full scan sem índice = 500 fichas. Escolher bem os índices é saber jogar sem desperdiçar fichas.",
tactic:"No portal Azure, execute queries com e sem filtro pela partition key no Data Explorer. O portal mostra o custo em RUs de cada query no cabeçalho da resposta. Ver 5 RUs vs 400 RUs fixa o conceito.",tacticColor:"p",
whenuse:{"tip": true, "items": ["<strong>Provisioned (fixo)</strong>: cargas previsíveis e constantes. Ex: sistema interno com 200 usuários das 8h às 18h. Você sabe exatamente quantos RUs vai precisar.", "<strong>Serverless</strong>: desenvolvimento, testes, e apps com tráfego muito baixo e intermitente (< 1000 requests/dia). Limite de 5000 RU/s por container.", "<strong>Autoscale</strong>: a maioria dos apps de produção. Picos imprevisíveis (Black Friday, campanhas). Você define o teto de custo (maxRU/s) e paga pelo que usar.", "<strong>Otimizar indexing policy</strong>: sempre que writes são caros — adicione excludedPaths para campos grandes não filtrados e includedPaths para só indexar o necessário."]},
  usecases:[{company:"Marketplace de produtos",scenario:"Queries lentas com 429 em horário de pico",desc:"Em promoções, o Cosmos DB retorna erros 429. Diagnóstico: queries sem filtro por partition key fazem fan-out (cross-partition) consumindo 800 RUs cada. Solução: adicionar partition key ao WHERE e campos filtrados ao includedPaths. Resultado: 800 RUs → 8 RUs por query.",badge:"otimização de rus"},
  {company:"Plataforma de analytics",scenario:"Workload com picos imprevisíveis",desc:"Relatórios são gerados sob demanda — às vezes 0 por hora, às vezes 1000 simultâneos. Autoscale com máximo de 10.000 RU/s resolve: nas horas ociosas escala para 1.000 RU/s (10% do máximo). Custo mensal 60% menor que Provisioned fixo.",badge:"autoscale"},
  {company:"Sistema de IoT",scenario:"Alta frequência de writes de sensores",desc:"10.000 sensores escrevem leituras a cada 5 segundos. Campo 'rawData' (string longa) foi excluído do indexing policy. Resultado: custo de write caiu de 15 RUs para 5 RUs por operação — economia de 66% só em indexação.",badge:"excludedpaths"}],
questions:[
{q:"Aplicação com picos de uso às 9h e 18h, quase idle à noite. Qual modo de throughput é mais custo-eficiente?",a:"Autoscale. Define-se o máximo necessário no pico. Fora do pico, escala para 10% do máximo. Você paga pelo que usa por hora.",why:null},
{q:"A aplicação recebe erros 429 do Cosmos DB. O que significa e como resolver sem aumentar RU/s?",a:"O throughput provisionado foi excedido. Soluções sem aumentar RU/s: otimizar queries (adicionar índices, filtrar por partition key). O SDK já faz retry com backoff exponencial automaticamente.",why:null}
]},

{id:"t9",num:"09",domain:"data",week:3,title:"Change Feed do Cosmos DB",tag:"AI Data · Semana 3",tagColor:"p",
summary:"Log persistente e ordenado de inserções e updates. Permite reagir a mudanças em tempo real — fundamental para gerar embeddings automaticamente.",
sections:[
{title:"Como funciona",content:`Toda insert ou update é registrada no change feed, partição por partição, em ordem cronológica. É um log persistente — você pode ler desde o início, a partir de agora, ou de um checkpoint.

Deletions: por padrão NÃO são capturadas. Para capturar, habilite AllVersionsAndDeletes mode.

Lease container: container auxiliar ("leases") onde o processor guarda o checkpoint. Permite múltiplas instâncias dividirem o trabalho e retomarem após restart.

Múltiplas instâncias: N processors em paralelo — o Cosmos DB distribui as partições automaticamente.

Resiliência: se o processor parar por horas, ao reiniciar retoma do checkpoint e processa todos os documentos que chegaram durante a pausa.`,
code:`const leaseContainer = client.database("ai-db").container("leases");
const monitoredContainer = client.database("ai-db").container("docs");

const processor = monitoredContainer.items
  .getChangeFeedProcessor(
    "embedding-generator",  // nome único do processor
    leaseContainer,
    { changeFeedProcessorOptions: { startTime: new Date() } },
    async (changes) => {
      for (const item of changes) {
        if (!item.embedding) {
          const emb = await generateEmbedding(item.content);
          await monitoredContainer.items.upsert({ ...item, embedding: emb });
        }
      }
    }
  );

await processor.start();`,lang:"typescript"}
],
analogy:"O Change Feed é o extrato bancário do Cosmos DB. Toda transação é registrada em ordem. Você pode ter múltiplos 'clientes' (processors) que leem o extrato de forma independente, cada um com seu marcador de onde parou.",
tactic:"Implemente um processor Node.js que loga cada mudança e insira documentos em outro terminal. Ver as mudanças chegando em tempo real é a melhor forma de entender o conceito.",tacticColor:"p",
whenuse:{"yes": ["Você precisa reagir a inserções/updates no Cosmos DB sem modificar o código que escreve os dados", "Pipeline de AI: gerar embeddings automaticamente quando um novo documento é salvo", "Sincronização em tempo real com outro sistema (data warehouse, cache, search index)", "Múltiplas instâncias de processamento que precisam dividir o trabalho sem coordenação manual"], "no": ["Você precisa reagir a DELETES (use AllVersionsAndDeletes mode — tem custo extra e complexidade)", "Você só precisa de um webhook simples (use Azure Function com Cosmos DB trigger — mais simples)", "O processamento pode ser em batch agendado — change feed é para reação em tempo real"]},
  usecases:[{company:"Plataforma de conteúdo",scenario:"Indexação automática para busca semântica",desc:"Quando um editor publica um artigo, o change feed detecta o novo item e dispara um processor que gera o embedding via Azure OpenAI e atualiza o documento com o campo /embedding. O editor não sabe que isso acontece — para ele, o artigo simplesmente fica 'pesquisável' em segundos.",badge:"geração de embedding"},
  {company:"Sistema de pedidos",scenario:"Sincronização com data warehouse",desc:"O change feed replica todos os novos pedidos para um Azure Synapse Analytics em tempo real (< 30 segundos de latência). O sistema de BI vê dados quase em tempo real sem impactar o banco de produção com queries pesadas.",badge:"sincronização realtime"},
  {company:"App de chat com AI",scenario:"Invalidação de cache baseada em mudanças",desc:"Quando um documento da base de conhecimento é atualizado, o change feed processor invalida automaticamente as entradas do semantic cache no Redis relacionadas ao documento. A próxima busca semântica busca contexto atualizado.",badge:"invalidação de cache"}],
questions:[
{q:"Você precisa gerar embeddings automaticamente para cada novo documento inserido, sem modificar o código que faz o insert. Como?",a:"Change Feed Processor. Um worker escuta o change feed e, para cada novo item, gera o embedding e atualiza o documento. O código original não precisa saber que isso acontece.",why:null},
{q:"O processor parou por 2 horas por falha. Ao reiniciar, ele processa os documentos inseridos durante a pausa?",a:"Sim. O lease container guarda o checkpoint. Ao reiniciar, retoma desse ponto e processa todos os documentos que chegaram durante a pausa.",why:null}
]},

{id:"t10",num:"10",domain:"data",week:3,title:"Vector Search no Cosmos DB",tag:"AI Data · Semana 3",tagColor:"p",
summary:"Armazenamento e busca de embeddings nativos com índice DiskANN. Novo na AI-200.",
sections:[
{title:"Embeddings e DiskANN",content:`Embedding: representação numérica de um texto como array de floats. Textos semanticamente similares ficam próximos no espaço vetorial mesmo sem compartilhar palavras. O modelo text-embedding-3-small do Azure OpenAI gera vetores de 1536 dimensões.

Exemplo: "Como resetar minha senha?" e "Esqueci meu password" têm embeddings muito próximos. "Como fazer bolo?" e "Resetar senha" têm embeddings distantes.

DiskANN: índice criado pela Microsoft Research. Usa disco (não só RAM) — permite datasets maiores.
Funções de distância: cosine (padrão para texto), dotProduct, euclidean.
VectorDistance(): função SQL para calcular distância. Score menor = mais similar.`,
code:`// Gerar embedding da pergunta
const { data } = await openai.embeddings.create({
  model: "text-embedding-3-small",
  input: "Como resetar minha senha?"
});

// Busca semântica: top 5 mais similares
const { resources } = await container.items.query({
  query: \`SELECT TOP 5 c.id, c.content,
          VectorDistance(c.embedding, @q) AS score
          FROM c ORDER BY VectorDistance(c.embedding, @q)\`,
  parameters: [{ name: "@q", value: data[0].embedding }]
}).fetchAll();
// score 0.05 = muito similar, score 0.95 = muito diferente`,lang:"typescript"}
],
analogy:null,
tactic:"Insira 20 frases em um container com DiskANN. Execute buscas semânticas e compare os scores. Tente variações da mesma pergunta — ver scores próximos torna o conceito de espaço vetorial concreto.",tacticColor:"p",
whenuse:{"yes": ["Você já usa Cosmos DB para seus dados JSON e quer adicionar busca semântica no mesmo serviço", "Precisa de escala global para o vector search (Cosmos DB replica os vetores junto com os dados)", "Quer aproveitar o change feed para indexar embeddings automaticamente ao inserir documentos", "Seu dataset de vetores é grande e precisa do DiskANN (otimizado para disco, não só RAM)"], "no": ["Você precisa de filtros relacionais complexos com JOINs (use PostgreSQL + pgvector)", "Você já tem dados no PostgreSQL — não vale migrar só para ter vector search", "Sua base é pequena e latência crítica sub-milissegundo é necessária (use Redis com vector index)"]},
  usecases:[{company:"Empresa de RH",scenario:"Busca por candidatos similares",desc:"CV de um candidato é convertido em embedding. A query VectorDistance encontra os 10 candidatos mais similares na base de dados por competências, experiência e perfil — sem precisar de busca por palavras-chave exata. 'Engenheiro Node.js sênior' encontra candidatos com 'desenvolvedor JavaScript 8 anos'.",badge:"busca semântica"},
  {company:"Suporte técnico",scenario:"Sugestão de artigos de FAQ relevantes",desc:"Quando um usuário abre um ticket com 'minha nota fiscal não chegou', o sistema gera o embedding da mensagem e busca os 5 artigos de FAQ mais semanticamente similares via VectorDistance. O agente vê as sugestões instantaneamente antes de responder.",badge:"rag + cosmos db"},
  {company:"Plataforma jurídica",scenario:"Busca em contratos por cláusulas similares",desc:"Advogado busca 'rescisão por motivo de força maior'. O vector search encontra contratos com cláusulas equivalentes mesmo escritas de formas diferentes: 'encerramento por evento imprevisível', 'dissolução por caso fortuito'. Busca por semântica, não por palavras.",badge:"semantic search"}],
questions:[
{q:"Dois resultados retornam VectorDistance = 0.05 e 0.89. Qual é mais similar?",a:"O resultado com score 0.05. VectorDistance retorna a distância — quanto menor, mais próximo (mais similar). Score 0 = idêntico. Score 1 = completamente diferente.",why:null},
{q:"Qual tipo de índice adicionar ao indexing policy para habilitar busca semântica?",a:"vectorIndexes com type 'diskANN' e o path do campo. Além disso, declarar vectorEmbeddingPolicy especificando dataType, distanceFunction e dimensions.",why:null}
]},

{id:"t11",num:"11",domain:"data",week:4,title:"Azure Database for PostgreSQL Flexible Server",tag:"AI Data · Semana 4",tagColor:"p",
summary:"PostgreSQL gerenciado com pgvector. Novidade na AI-200. Ideal quando você combina dados relacionais com busca semântica.",
sections:[
{title:"Compute tiers e Connection Pooling",content:`Compute tiers:
- Burstable (B-series): dev/teste.
- General Purpose (D-series): produção padrão.
- Memory Optimized (E-series): para vector search intenso. Índices HNSW vivem em RAM — mais memória = busca mais rápida.

PgBouncer (Connection Pooling built-in):
PostgreSQL cria 1 processo por conexão. Functions serverless criam conexões por request — esgota rapidamente.

PgBouncer: proxy de connection pooling.
- Session mode: conexão mantida por toda a sessão. Não reduz muito.
- Transaction mode: conexão liberada após cada transação. Ideal para serverless. Permite centenas de clientes com dezenas de conexões físicas.

Quando usar PostgreSQL vs Cosmos DB para vetores:
PostgreSQL: dados relacionais + vetores, JOINs complexos com metadata.
Cosmos DB: escala global, JSON + vetores, change feed para pipelines de AI.`}
],
analogy:null,
tactic:"Simule o problema de conexões: conecte 50 clients simultâneos sem PgBouncer (erros FATAL: too many connections) e com PgBouncer (tudo funciona). O problema se torna físico e memorável.",tacticColor:"p",
whenuse:{"yes": ["Você precisa combinar dados relacionais (clientes, pedidos, projetos) com vector search no mesmo banco", "Queries precisam de filtros SQL complexos junto com a busca semântica (WHERE + ORDER BY embedding)", "Seu time conhece SQL e prefere evitar aprender a API NoSQL do Cosmos DB", "Você quer aproveitar features SQL avançadas: transações ACID, triggers, views, stored procedures"], "no": ["Você precisa de escala global multi-região automática (use Cosmos DB)", "Seu schema é puramente de documentos JSON sem relações (use Cosmos DB)", "Você precisa de latência sub-milissegundo para os vetores (use Redis)", "Seu volume de writes é extremamente alto e o schema é flexível (use Cosmos DB)"]},
  usecases:[{company:"Plataforma SaaS B2B",scenario:"Dados relacionais + busca semântica no mesmo banco",desc:"Clientes têm projetos, projetos têm documentos, documentos têm embeddings. A query combina: WHERE project.client_id = ? (filtro relacional) com ORDER BY embedding <=> queryVec (vector search). Impossível no Cosmos DB sem desnormalizar tudo.",badge:"relacional + vetorial"},
  {company:"Startup de AI",scenario:"Azure Functions consumindo PostgreSQL",desc:"50 Functions simultâneas geravam 'too many connections'. Solução: habilitar PgBouncer no Flexible Server com transaction mode. As Functions se conectam à porta 6432. O PgBouncer mantém 10 conexões físicas para 50 clients. Problema resolvido sem aumentar o servidor.",badge:"pgbouncer"},
  {company:"Sistema de e-commerce",scenario:"Vector search intensivo em catálogo",desc:"Busca semântica em 5M de produtos com embeddings de 1536 dims. O servidor Memory Optimized (E-series) mantém o índice HNSW inteiro em RAM. Latência: 3ms. O General Purpose (D-series) paginava o índice para disco — latência: 180ms.",badge:"memory optimized"}],
questions:[
{q:"Azure Functions recebem erros 'too many connections' do PostgreSQL. Como resolver sem aumentar o servidor?",a:"Habilitar PgBouncer no Flexible Server com transaction mode. As Functions se conectam ao PgBouncer (porta 6432), que gerencia um pool menor de conexões físicas.",why:null},
{q:"Qual compute tier para workloads de vector search com índices HNSW?",a:"Memory Optimized (série E). Índices HNSW são carregados em RAM. Quanto mais RAM, mais do índice fica em memória e menor a latência.",why:null}
]},

{id:"t12",num:"12",domain:"data",week:4,title:"pgvector — HNSW e IVFFlat",tag:"AI Data · Semana 4",tagColor:"p",
summary:"Extensão do PostgreSQL para vetores. Adiciona tipos de dados e índices de similaridade. Novo na AI-200.",
sections:[
{title:"Operadores e índices",content:`3 operadores de distância:
- <=> Cosine distance: padrão para text embeddings. Independe do comprimento.
- <-> L2 (Euclidiana): para embeddings não normalizados.
- <#> Inner product: para embeddings normalizados.

HNSW: melhor recall (~99%), uso alto de RAM, build lento. Use em produção.
IVFFlat: menor RAM, build rápido, recall ~95%. Use quando dataset muda frequentemente.
Sem índice: brute force, 100% exato, só para dev e datasets < 10k rows.

Parâmetros HNSW:
- m: conexões por nó (padrão 16). Mais alto = melhor recall, mais RAM.
- ef_construction: qualidade do build (padrão 64).
- ef_search: candidatos na busca (runtime). Trade-off recall × velocidade.`,
code:`CREATE EXTENSION IF NOT EXISTS vector;

CREATE TABLE docs (
  id        UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  content   TEXT,
  metadata  JSONB,
  embedding vector(1536)
);

-- Índice HNSW para cosine similarity (produção)
CREATE INDEX ON docs
  USING hnsw (embedding vector_cosine_ops)
  WITH (m = 16, ef_construction = 64);

-- Ajustar recall na busca
SET hnsw.ef_search = 100;

-- Busca com metadata filter (relacional + vetorial!)
SELECT content, embedding <=> '[...]'::vector AS dist
FROM docs
WHERE metadata->>'project_id' = 'proj-123'
ORDER BY dist LIMIT 5;`,lang:"sql"}
],
analogy:"HNSW é como um índice de livros muito organizado — achar qualquer livro é rápido, mas construir o catálogo levou semanas. IVFFlat é como organizar livros em armários por tema — mais simples de montar, um pouco menos preciso para encontrar o livro exato.",
tactic:"Insira 50.000 rows com vetores. Meça com EXPLAIN ANALYZE: (1) sem índice, (2) com IVFFlat, (3) com HNSW. Os números de latência e 'Seq Scan vs Index Scan' tornam a diferença concreta.",tacticColor:"p",
whenuse:{"tip": true, "items": ["<strong>HNSW em produção</strong>: quando recall alto (~99%) é crítico e o dataset não muda frequentemente. Ex: busca em base jurídica onde falsos negativos têm custo alto. Requer Memory Optimized (E-series) para manter o índice em RAM.", "<strong>IVFFlat</strong>: quando o dataset muda frequentemente (rebuild do índice é necessário), ou memória é limitada e um recall de ~95% é aceitável.", "<strong>Sem índice (brute force)</strong>: apenas em desenvolvimento ou datasets com menos de 10.000 registros. Não use em produção.", "<strong>Operador <=></strong>: sempre para text embeddings (cosine distance). Independe do comprimento do vetor.", "<strong>Operador <-></strong>: use para embeddings de imagens ou embeddings não normalizados onde a magnitude importa."]},
  usecases:[{company:"Plataforma de notícias",scenario:"'Artigos relacionados' por similaridade de conteúdo",desc:"Cada artigo tem um embedding do seu conteúdo. Ao abrir um artigo, a query usa <=> (cosine) para buscar os 5 artigos mais similares. 'Eleições EUA' mostra artigos sobre 'Democracia americana', 'Candidatos presidenciais', 'Sistema eleitoral' — mesmo sem palavras em comum.",badge:"cosine similarity"},
  {company:"Plataforma jurídica",scenario:"Escolha entre HNSW e IVFFlat",desc:"Base de 2M de cláusulas contratuais. Testaram IVFFlat (build rápido, recall 93%) vs HNSW (build 4x mais lento, recall 99%). Como a base não muda frequentemente e falsos negativos têm custo alto (advogado perde um contrato relevante), escolheram HNSW em produção.",badge:"hnsw vs ivfflat"},
  {company:"Sistema de compliance",scenario:"Filtro relacional + vetorial combinado",desc:"'Busque contratos similares a este trecho, somente de clientes com risco alto, nos últimos 6 meses'. A query: WHERE risk_level='high' AND created_at > now()-interval '6 months' ORDER BY embedding <=> queryVec LIMIT 10. Isso é impossível em bancos de vetores puros.",badge:"metadata filter"}],
questions:[
{q:"Em produção com alta demanda de recall, qual índice pgvector usar?",a:"HNSW com vector_cosine_ops para text embeddings. Oferece ~99% de recall com latência sub-milissegundo em produção.",why:null},
{q:"Qual operador pgvector usar para text embeddings do Azure OpenAI?",a:"<=> (cosine distance). É o padrão para embeddings de texto — mede o ângulo entre vetores, independente da magnitude.",why:null},
{q:"Você precisa buscar os 5 documentos mais similares, somente entre documentos de um projeto específico. Vantagem do PostgreSQL?",a:"SQL rico com JOINs e filtros relacionais. Você combina vector similarity search com filtros de metadata complexos em uma única query SQL. No Cosmos DB os filtros são mais limitados.",why:null}
]},

{id:"t13",num:"13",domain:"data",week:4,title:"Padrão RAG (Retrieval-Augmented Generation)",tag:"AI Data · Semana 4",tagColor:"p",
summary:"Arquitetura para criar assistentes com base em documentos próprios sem fine-tuning. Novo na AI-200.",
sections:[
{title:"O problema e a solução",content:`O problema: um LLM como GPT-4o não sabe nada sobre seus documentos internos. E mesmo que soubesse, inventaria respostas (alucina). Fine-tuning é caro e não atualiza em tempo real.

RAG resolve: busca os documentos relevantes no banco de dados em tempo real e injeta no prompt. O modelo responde baseado em fatos reais que você forneceu.

Chunking — preparar os documentos:
Antes de indexar, divida documentos em chunks menores.
- Modelos de embedding têm limite de tokens (~8000).
- Chunks específicos têm embeddings mais precisos que documentos completos.
- Overlap (ex: 50 tokens): sobreposição entre chunks evita perder contexto na fronteira.

Fluxo: Pergunta → Embed → Vector Search → Montar prompt com contexto → Azure OpenAI → Resposta`,
code:`async function rag(question: string): Promise<string> {
  // 1. Embed a pergunta
  const { data } = await openai.embeddings.create({
    model: "text-embedding-3-small", input: question
  });

  // 2. Buscar contexto relevante
  const docs = await sql\`
    SELECT content, title FROM docs
    ORDER BY embedding <=> \${JSON.stringify(data[0].embedding)}::vector
    LIMIT 5\`;

  // 3. Montar prompt com contexto (o núcleo do RAG)
  const context = docs.map(d => \`[\${d.title}]\n\${d.content}\`).join("\\n---\\n");

  const resp = await openai.chat.completions.create({
    model: "gpt-4o",
    messages: [
      { role: "system", content: "Responda APENAS com base no contexto fornecido." },
      { role: "user", content: \`Contexto:\\n\${context}\\n\\nPergunta: \${question}\` }
    ]
  });

  return resp.choices[0].message.content!;
}`,lang:"typescript"}
],
analogy:"RAG é como um estudante de medicina fazendo prova com livros abertos. Ele não precisa memorizar tudo — precisa saber encontrar a informação certa no livro certo e sintetizar a resposta. O 'livro' é sua base vetorial, o 'estudante' é o LLM.",
tactic:"Implemente RAG com 10 documentos de FAQ fictícia. Faça perguntas que estão nos documentos e que não estão. Observe como a instrução 'responda só com o contexto' impede alucinações. A diferença com/sem contexto é reveladora.",tacticColor:"p",
whenuse:{"yes": ["Você quer que um LLM responda com base nos seus documentos internos sem fine-tuning", "A base de conhecimento muda frequentemente (novos documentos, atualizações) — fine-tuning seria caro demais", "Você precisa que as respostas sejam auditáveis (você pode mostrar quais trechos embasaram a resposta)", "Chatbots de suporte, assistentes de documentação, Q&A sobre manuais e regulamentos"], "no": ["Você quer mudar o comportamento do modelo (tom, personalidade, estilo) — use fine-tuning", "Sua base de conhecimento é estática, pequena e cabe no context window do modelo", "Você não tem estrutura para manter um pipeline de indexação e busca de vetores"]},
  usecases:[{company:"Banco digital",scenario:"Assistente de atendimento com base de regulamentos",desc:"O banco tem 500 documentos de regulamentos do Banco Central. O RAG indexa todos com embeddings. Quando um atendente pergunta 'qual o prazo para estorno de PIX?', o sistema busca os trechos mais relevantes e o LLM responde com base nos regulamentos reais — sem inventar. Auditável e preciso.",badge:"rag compliance"},
  {company:"Empresa de software",scenario:"Documentação técnica interna como assistente",desc:"1200 páginas de documentação interna do produto. Devs perguntam em linguagem natural: 'como configurar autenticação SAML?'. O RAG encontra os 3 chunks mais relevantes e o LLM sintetiza a resposta. Adoção do produto interno subiu 40%.",badge:"rag docs"},
  {company:"Clínica médica",scenario:"Histórico de pacientes como contexto",desc:"Médico pergunta 'paciente tem contraindicação para ibuprofeno?'. O RAG busca os chunks relevantes do prontuário (alergias, medicamentos atuais, diagnósticos) e o LLM responde com base no histórico real do paciente. O modelo não 'inventa' — só usa o contexto fornecido.",badge:"rag médico"}],
questions:[
{q:"Um assistente de suporte responde perguntas sobre manuais técnicos. O modelo não deve inventar respostas. Qual padrão usar?",a:"RAG. Os manuais são indexados com embeddings. Para cada pergunta, você busca chunks relevantes por vector search e injeta como contexto no prompt, instruindo o modelo a só usar o contexto fornecido.",why:null},
{q:"Por que dividir documentos em chunks menores antes de gerar embeddings?",a:"(1) Modelos de embedding têm limite de tokens. (2) Chunks específicos geram embeddings mais precisos. (3) O contexto injetado no prompt fica mais relevante quando você recupera chunks específicos.",why:null}
]},

{id:"t14",num:"14",domain:"data",week:5,title:"Azure Managed Redis",tag:"AI Data · Semana 5",tagColor:"p",
summary:"Redis Enterprise gerenciado. Na AI-200 aparece como cache de dados e banco de vetores para semantic caching. Novo na AI-200.",
sections:[
{title:"Cache-aside pattern",content:`Antes de ir ao banco, verifique o cache.
Hit: retorne em < 1ms (cache hit).
Miss: vá ao banco, guarde no cache com TTL, retorne (cache miss).
Update: quando o dado muda, delete a chave (invalidação).

TTL (Time To Live): expiração automática. Previne dados stale.

Quando usar Redis para vetores vs Cosmos DB vs PostgreSQL:
Redis: latência sub-milissegundo, dataset pequeno-médio (cabe em RAM), dados efêmeros.
Cosmos DB: escala global, datasets grandes, JSON + vetores.
PostgreSQL: dados relacionais + vetores, JOINs complexos.`,
code:`import { createClient } from "redis";
const redis = await createClient({ url: process.env.REDIS_URL }).connect();

// Cache-aside pattern
async function getUserById(userId: string) {
  const cacheKey = \`user:\${userId}\`;

  // Tenta o cache (hit)
  const cached = await redis.get(cacheKey);
  if (cached) return JSON.parse(cached);

  // Cache miss — vai ao banco
  const user = await db.findUser(userId);

  // Guarda no cache com TTL de 15 minutos
  await redis.set(cacheKey, JSON.stringify(user), { EX: 900 });
  return user;
}

// Invalidar quando o dado muda
async function updateUser(userId: string, data: any) {
  await db.updateUser(userId, data);
  await redis.del(\`user:\${userId}\`); // invalida cache
}`,lang:"typescript"}
],
analogy:"Redis é a memória de curto prazo do sistema. O banco de dados é a memória de longo prazo. Buscar na memória de curto prazo leva milissegundos. Buscar no 'HD' leva centenas de milissegundos.",
tactic:"Implemente o cache-aside e meça com performance.now() a diferença entre hit e miss. Ver '0.3ms vs 45ms' no console é mais convincente que qualquer explicação teórica.",tacticColor:"p",
whenuse:{"yes": ["Dados lidos com alta frequência e que mudam com pouca frequência (perfis de usuário, configurações, catálogo de produtos)", "Você quer reduzir latência de leitura de 50ms (banco) para < 1ms (cache)", "Sessões de usuário, carrinhos de compra, tokens de autenticação com TTL", "Leaderboards e rankings em tempo real com Sorted Sets"], "no": ["Dados que mudam muito frequentemente — o overhead de invalidar o cache pode superar o benefício", "Dados que precisam de consistência forte — o cache pode ter versão desatualizada", "Datasets grandes que não cabem na memória disponível (Redis é in-memory — limite de RAM)"]},
  usecases:[{company:"App de e-commerce",scenario:"Cache de sessão de carrinho de compras",desc:"A cada request do usuário, buscar o carrinho no banco (SQL ou Cosmos) levaria 30-50ms. Com Redis: o carrinho fica cacheado com TTL de 30 minutos. 95% das requests retornam em < 1ms. O banco de dados recebe 95% menos queries de leitura.",badge:"cache-aside"},
  {company:"Plataforma de jogos",scenario:"Leaderboard em tempo real",desc:"Sorted Set do Redis mantém o ranking de milhares de jogadores atualizado em tempo real. ZADD para atualizar score, ZRANGE para buscar top 100. Latência < 1ms. Um banco de dados relacional levaria 200ms+ para a mesma query com ORDER BY em milhões de registros.",badge:"sorted set"},
  {company:"Sistema de AI",scenario:"Semantic cache para reduzir custo de OpenAI",desc:"Um chatbot de suporte recebia 10.000 perguntas/dia. Após implementar semantic cache no Redis, 62% das perguntas eram semanticamente similares a respostas já cacheadas. Custo mensal de API: de R$ 4.200 para R$ 1.600. Sem mudança na experiência do usuário.",badge:"semantic cache"}],
questions:[
{q:"Um dado cacheado foi atualizado no banco. O que fazer para garantir que a próxima leitura retorne o dado atualizado?",a:"Invalidar o cache (redis.del(chave)) após a atualização. A próxima leitura será um miss, buscará o dado atualizado e o guardará no cache novamente.",why:null},
{q:"Quando Azure Managed Redis é a melhor escolha como banco de vetores?",a:"Quando você precisa de latência sub-milissegundo, o dataset cabe em RAM, os dados são efêmeros (session-level, semantic cache), ou quer combinar cache de dados com busca semântica no mesmo serviço.",why:null}
]},

{id:"t15",num:"15",domain:"data",week:5,title:"Semantic Cache com Redis",tag:"AI Data · Semana 5",tagColor:"p",
summary:"Cache de chamadas LLM usando similaridade semântica. Reduz drasticamente custo de tokens e latência. Novo na AI-200.",
sections:[
{title:"Por que cache tradicional não basta para LLMs",content:`Cache tradicional usa igualdade exata de strings. "Qual o horário de funcionamento?" e "Que horas vocês abrem?" são chaves DIFERENTES → dois cache misses → duas chamadas caras ao OpenAI.

Com semantic cache: você converte a pergunta em embedding e usa KNN search para encontrar respostas semanticamente similares no Redis. Similaridade > 0.95 → mesma pergunta → retorne a resposta cacheada. Zero custo de token, < 1ms de latência.

Threshold: o valor de similaridade a partir do qual você considera "mesma pergunta". 0.95 = conservador (alta precisão). 0.80 = mais agressivo.

Impacto: em apps conversacionais, pode reduzir até 60% das chamadas ao LLM.`}
],
analogy:"Semantic cache é como um funcionário de suporte experiente. Quando alguém pergunta 'como reseto minha senha?', ele reconhece que é a mesma coisa que 'esqueci meu password' e dá a mesma resposta sem consultar o manual.",
tactic:"Implemente semantic cache básico e colete 20 perguntas variadas sobre o mesmo tema. Meça quantas chamadas ao OpenAI foram necessárias com vs sem cache.",tacticColor:"p",
whenuse:{"yes": ["Sua aplicação faz muitas chamadas ao Azure OpenAI com perguntas similares dos usuários", "O custo de tokens é alto e você quer reduzir sem degradar a experiência", "Chatbots de suporte, FAQ, assistentes onde perguntas se repetem com frequência", "Você já usa Redis e quer aproveitar a mesma infraestrutura para cache semântico"], "no": ["Todas as perguntas são genuinamente únicas — o overhead de gerar o embedding para consultar o cache não vale", "Você precisa de respostas sempre atualizadas (ex: preços em tempo real, dados que mudam por segundo)", "Seu volume de chamadas é baixo — o custo de manter Redis não compensa a economia de tokens"]},
  usecases:[{company:"Empresa de RH",scenario:"Chatbot de triagem de candidatos",desc:"Candidatos fazem as mesmas 20 perguntas ('Qual o salário?', 'Tem home office?', 'Quais os benefícios?'). Com semantic cache, 80% das perguntas são respondidas do cache em < 1ms. Apenas perguntas genuinamente novas vão ao Azure OpenAI. Redução de 78% no custo de tokens.",badge:"80% hit rate"},
  {company:"Plataforma de suporte",scenario:"FAQ dinâmico sem base estática",desc:"Em vez de manter uma lista rígida de FAQs, o semantic cache aprende organicamente. As perguntas mais frequentes ficam no cache com alta taxa de hit. Perguntas raras e únicas vão ao LLM. O sistema fica mais eficiente com o tempo, sem configuração manual.",badge:"cache adaptativo"},
  {company:"E-commerce de moda",scenario:"Recomendações de produtos similares",desc:"'Me mostre roupas similares a esta peça' — o semantic cache guarda as recomendações para embeddings de produtos já consultados. Quando outro usuário faz consulta semanticamente similar, retorna do cache. Latência: 2ms vs 800ms da chamada ao modelo.",badge:"product similarity"}],
questions:[
{q:"Os custos de API do Azure OpenAI estão altos pois muitos usuários fazem perguntas similares. Qual solução?",a:"Semantic cache com Azure Managed Redis. Antes de cada chamada ao OpenAI, gere o embedding da pergunta e faça KNN search no Redis. Se a similaridade for >= threshold, retorne a resposta cacheada.",why:null},
{q:"O que diferencia semantic cache de cache de string normal?",a:"Vector similarity search. Em vez de comparar strings exatas, você converte a pergunta em embedding e usa KNN search para encontrar respostas semanticamente similares. Requer índice vetorial (HNSW ou FLAT) no Redis.",why:null}
]},

{id:"t16",num:"16",domain:"messaging",week:6,title:"Azure Service Bus",tag:"Mensageria · Semana 6",tagColor:"g",
summary:"Message broker enterprise com garantia de entrega, ordering e transações. O backbone de pipelines de AI que precisam de confiabilidade.",
sections:[
{title:"Queue vs Topic/Subscription e Sessions",content:`Queue — ponto a ponto:
Uma mensagem é consumida por exatamente UM consumer. Para jobs de processamento únicos.

Message lock: mensagem fica "invisible" para outros pelo tempo de lock (padrão: 60s). O consumer deve:
- Complete: processei com sucesso → remove da fila.
- Abandon: devolve para a fila (outro consumer pode pegar).
- Dead-letter: move para DLQ (dados inválidos).
- Timeout: lock expira → mensagem volta automaticamente para a fila.

maxDeliveryCount: tentativas antes de ir para a DLQ. Padrão: 10.

Topic + Subscriptions — pub/sub:
1 mensagem publicada + 3 subscriptions = 3 cópias independentes.
Filters em subscriptions: filtra por propriedades da mensagem.

Sessions — ordered processing:
Mensagens com mesmo sessionId são processadas pela mesma instância do consumer, em ordem FIFO. Use quando eventos de um mesmo usuário devem ser processados em sequência.`}
],
analogy:"Queue = sistema de senhas de um banco. Uma senha é chamada por exatamente um caixa. Topic = rádio AM. A estação emite uma vez. Todos os ouvintes (subscriptions) recebem o mesmo sinal simultaneamente, de forma independente.",
tactic:"Crie uma fila, envie 5 mensagens e processe com duas instâncias em paralelo. Observe que nenhuma mensagem é processada duas vezes. Depois lance uma exception propositalmente — observe a mensagem voltar para a fila e eventualmente ir para a DLQ.",tacticColor:"g",
whenuse:{"yes": ["Você precisa de garantia de entrega at-least-once — mensagem nunca pode ser perdida", "Ordering importa (use Sessions com sessionId)", "Múltiplos sistemas precisam reagir ao mesmo evento de forma independente (use Topics + Subscriptions)", "Jobs de AI que precisam ser processados exatamente uma vez com possibilidade de retry em falha"], "no": ["Você precisa de streaming de altíssimo volume (> 100k eventos/s) — use Event Hubs", "O evento é reativo e precisa notificar N sistemas sem garantia forte — use Event Grid", "Sua mensagem tem mais de 256KB (padrão) ou mais de 100MB (Premium) — considere armazenar no Blob e só passar a referência"]},
  usecases:[{company:"Marketplace de pagamentos",scenario:"Processamento garantido de transações financeiras",desc:"Cada transação é uma mensagem na fila do Service Bus. Se o processador falha (queda de servidor, timeout do banco), a mensagem volta para a fila e é reprocessada automaticamente. Com dead-letter queue, transações que falham 10x são isoladas para análise — nunca perdidas silenciosamente.",badge:"garantia de entrega"},
  {company:"Sistema de pedidos",scenario:"Notificação de múltiplos sistemas em um evento",desc:"Quando um pedido é confirmado, uma mensagem vai para um topic. 3 subscriptions recebem cópias independentes: serviço de email (envia confirmação), serviço de estoque (reserva itens) e analytics (registra conversão). Se o serviço de email cair, os outros dois continuam processando.",badge:"topic + subscriptions"},
  {company:"Banco digital",scenario:"Eventos de conta de um usuário em ordem",desc:"Crédito, débito, taxa, estorno — todos os eventos da conta do usuário precisam ser processados em ordem cronológica. Sessions com sessionId=accountId garante que todos os eventos da conta 'C001' vão para o mesmo consumer instance, em ordem FIFO.",badge:"sessions fifo"}],
questions:[
{q:"Uma mensagem de pagamento precisa notificar simultaneamente: email, analytics e estoque. Como modelar?",a:"Topic com 3 subscriptions. Quando o pagamento é publicado no topic, cada subscription recebe uma cópia independente.",why:null},
{q:"Eventos de um mesmo usuário precisam ser processados em ordem cronológica. Qual feature usar?",a:"Sessions com sessionId = userId. Todas as mensagens do mesmo usuário têm o mesmo sessionId, garantindo processamento FIFO pela mesma instância.",why:null},
{q:"Uma Function recebeu uma mensagem do Service Bus mas o processamento falhou. O que acontece?",a:"O lock expira e a mensagem volta para a fila (delivery count + 1). Após atingir maxDeliveryCount (padrão 10), a mensagem vai automaticamente para a Dead-Letter Queue.",why:null}
]},

{id:"t17",num:"17",domain:"messaging",week:6,title:"Dead-Letter Queue (DLQ)",tag:"Mensageria · Semana 6",tagColor:"g",
summary:"Sub-fila automática para mensagens que não podem ser processadas. Sem DLQ, mensagens-problema causam loops infinitos.",
sections:[
{title:"Quando uma mensagem vai para a DLQ",content:`maxDeliveryCount excedido: falhou N vezes (padrão: 10) → DLQ automaticamente.
TTL expirado: ficou na fila mais tempo que o TimeToLive configurado.
Dead-letter manual: o consumer move explicitamente para dados inválidos irrecuperáveis.
Filter evaluation error: erro ao avaliar filtro de subscription.

Como acessar a DLQ:
Path: nome-da-fila/$DeadLetterQueue
Crie uma Function ou worker com trigger nesse path para processar, alertar ou arquivar.

Boas práticas:
- Crie alerta no Azure Monitor quando DLQ message count > 0.
- Nunca ignore a DLQ — ela acumula silenciosamente.
- Guarde o motivo de dead-letter no log para análise.`}
],
analogy:"A DLQ é a caixa de 'devolvidos' dos Correios. Cartas que não puderam ser entregues vão para lá. Sem monitorar, se acumulam silenciosamente. Em sistemas de AI, uma mensagem na DLQ pode ser um dado de cliente perdido.",
tactic:"Crie uma Function que sempre lança exception para mensagens com um campo específico. Observe as mensagens indo para a DLQ após 10 tentativas. Configure o alerta do Azure Monitor. Ver o alerta disparar é mais impactante que ler sobre ele.",tacticColor:"g",
whenuse:{"tip": true, "items": ["<strong>Configure sempre</strong>: toda fila e topic do Service Bus em produção deve ter a DLQ monitorada. Nunca deixe a DLQ crescer silenciosamente.", "<strong>Dead-letter manual</strong>: use quando o consumer detecta dados inválidos irrecuperáveis (CPF malformado, JSON corrompido) — move para DLQ com uma razão clara para análise posterior.", "<strong>Ajuste maxDeliveryCount</strong>: o padrão é 10. Para operações idempotentes simples, 3 é suficiente. Para operações com dependências externas instáveis, 10–15 faz sentido.", "<strong>Azure Monitor alert</strong>: sempre crie um alerta quando DLQ message count > 0. O time deve ser notificado imediatamente, não descobrir na reclamação de usuário horas depois.", "<strong>Worker dedicado para DLQ</strong>: crie uma Function separada com trigger na DLQ para processar, alertar e arquivar as mensagens problemáticas de forma estruturada."]},
  usecases:[{company:"Plataforma de AI",scenario:"Documentos malformados que travam o pipeline",desc:"Um batch de documentos tinha arquivos corrompidos. A Function de geração de embeddings falhava ao tentar parsear o JSON. Após 10 tentativas, os documentos corrompidos foram para a DLQ automaticamente — o pipeline continuou processando os outros 9.990 documentos normalmente. O time foi alertado pelo Azure Monitor.",badge:"isolamento de falhas"},
  {company:"Sistema de pedidos",scenario:"Pedidos com dados inválidos",desc:"Um pedido chegou com CPF inválido. Em vez de deixar a mensagem travar a fila, o consumer fez dead-letter manual com a razão 'cpf_invalido'. O time de suporte tem uma Function monitorando a DLQ que envia email automático para o cliente pedir correção.",badge:"dead-letter manual"},
  {company:"Fintech",scenario:"Monitoramento proativo de saúde do pipeline",desc:"Um alerta no Azure Monitor dispara quando DLQ message count > 0. O time recebe uma notificação no Teams em menos de 5 minutos. Sem esse alerta, o acúmulo seria percebido apenas na reclamação de usuários — horas depois.",badge:"azure monitor alert"}],
questions:[
{q:"Mensagens do Service Bus estão desaparecendo após algumas falhas. Onde foram?",a:"Foram para a Dead-Letter Queue após atingir o maxDeliveryCount. Acesse via nome-da-fila/$DeadLetterQueue no portal Azure ou crie uma Function com ServiceBus trigger nesse path.",why:null},
{q:"Como garantir que a equipe seja alertada quando mensagens inválidas chegam à DLQ?",a:"Criar alerta no Azure Monitor na métrica 'Dead-letter message count' do Service Bus. Quando subir acima de 0, disparar notificação por email/Teams/webhook.",why:null}
]},

{id:"t18",num:"18",domain:"messaging",week:6,title:"Azure Event Grid",tag:"Mensageria · Semana 6",tagColor:"g",
summary:"Roteador de eventos reativo. 'Algo aconteceu → notifique N sistemas.' Fan-out de eventos de serviços Azure.",
sections:[
{title:"Modelo e features",content:`Event sources nativas: Blob Storage, Cosmos DB, Resource Groups, Container Registry, etc.
Custom Topics: seu próprio app publica eventos customizados.
Handlers: Azure Function, Webhook, Service Bus, Event Hubs, Logic Apps.
Filters: por tipo de evento (Microsoft.Storage.BlobCreated) e por subject (prefixo/sufixo do blob path).

Retry: exponential backoff por até 24h se o handler retornar erro.
Dead-letter: Storage Blob container onde eventos não entregues são gravados após esgotar retries.

Diferença do Service Bus:
Event Grid: eventos reativos e fan-out (notificar N sistemas).
Service Bus: jobs confiáveis (processar por exatamente um consumer, com DLQ).`}
],
analogy:"Event Grid é como um serviço de alerta sísmico. Quando um terremoto acontece, notifica simultaneamente: sismólogos, defesa civil, apps de celular. Cada um recebe a mesma notificação e reage independentemente. Ninguém 'processa' o terremoto — apenas reagem.",
tactic:"Configure Blob Storage para emitir eventos para uma Azure Function via Event Grid. Faça upload de um arquivo e observe a Function ser disparada. Depois crie uma segunda subscription e veja a Function ser chamada duas vezes — o fan-out em ação.",tacticColor:"g",
whenuse:{"yes": ["Você quer reagir a eventos nativos de serviços Azure (Blob Storage, Cosmos DB, Resource Groups) sem código extra", "Fan-out: um evento precisa notificar múltiplos sistemas de forma independente", "Eventos são pequenos (< 1MB) e o padrão é 'fire and forget' com retry automático", "Orquestração baseada em eventos: blob criado → Function dispara → pipeline inicia"], "no": ["Você precisa de garantia de entrega forte com ordering e dead-letter (use Service Bus)", "Seu payload é grande (> 1MB) — Event Grid não suporta payloads grandes (passe referência ao Blob)", "Você precisa de streaming de alta frequência contínua (use Event Hubs)", "O consumer precisa processar a mensagem exatamente uma vez com lock (use Service Bus)"]},
  usecases:[{company:"Plataforma de documentos",scenario:"Pipeline de processamento ao fazer upload",desc:"Usuário faz upload de um PDF. O Blob Storage emite um evento BlobCreated para o Event Grid. 3 subscriptions reagem: Function de OCR (extrai texto), Function de antivírus (verifica o arquivo) e Function de geração de thumbnail. Cada uma processa independentemente, em paralelo.",badge:"fan-out paralelo"},
  {company:"Sistema de e-commerce",scenario:"Reação a mudanças de preço no Cosmos DB",desc:"Quando um preço é atualizado no Cosmos DB, um evento vai para o Event Grid. A subscription do serviço de cache invalida as entradas de preço no Redis. A subscription de analytics registra o histórico de preços. Tudo sem o serviço de produtos saber que isso acontece.",badge:"event-driven"},
  {company:"Empresa de IoT",scenario:"Orquestração de alertas de dispositivos",desc:"Sensor detecta temperatura crítica. Evento customizado vai para um Custom Topic do Event Grid com propriedades 'severity=critical, device_id=d123'. Subscription com filter só recebe events com severity=critical. A Function de alerta SMS é disparada apenas quando realmente necessário.",badge:"event filters"}],
questions:[
{q:"Um PDF é enviado para o Blob Storage. Três sistemas precisam ser notificados: thumbnail, extrator de texto e auditoria. Qual serviço?",a:"Azure Event Grid. O Blob Storage emite BlobCreated nativamente. Crie 3 event subscriptions. Cada sistema recebe o evento independentemente.",why:null},
{q:"Uma subscription do Event Grid está falhando. O evento vai ser perdido após todos os retries?",a:"Não, se dead-lettering estiver configurado. Configure um Storage Blob container como dead-letter destination. Após esgotar os retries (24h), o evento é gravado no blob.",why:null}
]},

{id:"t19",num:"19",domain:"messaging",week:6,title:"Azure Functions",tag:"Mensageria · Semana 6",tagColor:"g",
summary:"Plataforma serverless para executar código em resposta a eventos. O 'cola' de pipelines de AI.",
sections:[
{title:"Hosting Plans",content:`Consumption: serverless puro. Paga por execução. Escala a zero. Cold start ~200ms. Para workloads intermitentes.

Premium: sem cold start (instâncias pré-aquecidas). VNet integration. Para funções que não toleram latência de cold start ou acessam recursos em VNet privada.

Dedicated (App Service): sempre ativo. Para execuções muito longas (> 10 min) ou integradas a App Service.

Container Apps: functions em containers com KEDA. Combine serverless com controle de container.

Timeouts:
- Consumption: máximo 10 minutos.
- Premium: máximo 60 minutos.
- Dedicated: sem limite.`}
],
analogy:"Functions são garçons chamados conforme demanda. Consumption: zero garçons quando vazio (scale-to-zero), aparecem em ~200ms (cold start). Premium: sempre tem garçons pré-posicionados (sem cold start), mas você paga por eles mesmo sem movimento.",
tactic:"Crie uma Function no Consumption e meça o cold start com Date.now(). Depois crie a mesma no Premium com 1 always-ready instance e compare. A diferença de 800ms vs 5ms é difícil de esquecer.",tacticColor:"g",
whenuse:{"tip": true, "items": ["<strong>Consumption</strong>: workloads intermitentes, baixo volume, sem requisito de latência de cold start. Custo zero quando ocioso. Limite de 10 minutos de execução.", "<strong>Premium</strong>: cold start inaceitável, VNet integration necessária, execuções longas (até 60 min), ou quando você precisa de instâncias pré-aquecidas para SLA de latência.", "<strong>Dedicated (App Service)</strong>: execuções muito longas (> 60 min), integração com App Service existente, ou quando você já tem um plano App Service subutilizado.", "<strong>Container Apps</strong>: quando você precisa de KEDA para autoscaling baseado em eventos E controle de container (imagem customizada, sidecar). O modelo mais flexível."]},
  usecases:[{company:"Startup de AI",scenario:"API de geração de texto sob demanda",desc:"API HTTP-triggered que chama Azure OpenAI. Paga apenas por execução. 1000 requests/mês = custo mínimo. No plano Consumption, cold starts de 200ms são aceitáveis (usuário não percebe). Se o volume crescer para 1M requests/mês, considerar Premium.",badge:"consumption plan"},
  {company:"Plataforma de trading",scenario:"Execução de ordens com latência crítica",desc:"Function de processamento de ordens precisa responder em < 50ms. O cold start do Consumption (800ms) é inaceitável. Solução: Premium com 2 instâncias always-ready. Zero cold start. A latência constante é necessária mesmo pagando pelo tempo ocioso.",badge:"premium always-ready"},
  {company:"Sistema de relatórios",scenario:"Geração de relatórios PDF de 300 páginas",desc:"A geração de um relatório completo pode levar 45 minutos. O plano Consumption tem timeout de 10 minutos. Solução: Dedicated (App Service) sem timeout. A Function é disparada por um Timer às 2h da manhã e termina quando o PDF estiver pronto.",badge:"dedicated sem timeout"}],
questions:[
{q:"Uma API pública precisa de resposta em < 100ms. O plano Consumption gera cold starts de 800ms. Como resolver?",a:"Migrar para o plano Premium com always-ready instances. O Premium mantém instâncias pré-aquecidas, eliminando cold starts.",why:null},
{q:"Uma Function precisa acessar um PostgreSQL em uma VNet privada (sem IP público). Qual plano suporta?",a:"Premium ou Dedicated (App Service). O plano Consumption não suporta VNet integration.",why:null}
]},

{id:"t20",num:"20",domain:"messaging",week:6,title:"Triggers e Bindings",tag:"Mensageria · Semana 6",tagColor:"g",
summary:"A 'mágica' do Azure Functions — conectam a function a serviços externos sem código boilerplate de infraestrutura.",
sections:[
{title:"Trigger, Input e Output",content:`Trigger (1 por function): o que dispara a function. HTTP, Timer, Service Bus, Blob, Event Grid, Cosmos DB change feed.

Input binding: dados adicionais lidos antes de executar. Ex: ler doc do Cosmos DB pelo id da mensagem do trigger — sem código de SDK.

Output binding: onde gravar o resultado. Ex: salvar no Cosmos DB, enviar mensagem, escrever blob — só precisa de um return ou setter. O runtime executa a operação.

Princípio: você escreve apenas a lógica de negócio. O runtime gerencia conexões, autenticação e I/O.`,
code:`import { app, output } from "@azure/functions";

// Declaração do output binding (Cosmos DB)
const cosmosOut = output.cosmosDB({
  databaseName: "ai-db", containerName: "results",
  connection: "COSMOS_CONNECTION", createIfNotExists: true
});

// Trigger: Service Bus | Output: Cosmos DB
// Zero código de SDK para conexão/autenticação!
app.serviceBusTrigger("processJob", {
  queueName: "ai-jobs",
  connection: "SB_CONNECTION",
  extraOutputs: [cosmosOut],
  handler: async (msg: any, ctx) => {
    const embedding = await generateEmbedding(msg.text);

    // Output binding — o runtime salva no Cosmos automaticamente
    ctx.extraOutputs.set(cosmosOut, {
      id: msg.id, embedding,
      processedAt: new Date().toISOString()
    });
  }
});`,lang:"typescript"}
],
analogy:"Bindings são como conectores elétricos padronizados. Você não precisa saber como a energia chega à tomada — só encaixa o plugue (binding) e a eletricidade flui. O Azure gerencia toda a infraestrutura de 'energia' por baixo.",
tactic:"Implemente a mesma funcionalidade com output binding e com SDK direto. Compare as linhas de código. A redução de 30 linhas para 3 justifica a abstração.",tacticColor:"g",
whenuse:{"yes": ["Você quer eliminar código boilerplate de conexão, autenticação e retry com serviços Azure", "Pipeline simples: disparado por evento → lê dados → processa → salva resultado", "Você prefere declarar integrações como configuração ao invés de código SDK"], "no": ["Você precisa de lógica complexa de retry customizada além do que o runtime oferece", "Você precisa de controle fino sobre transações entre múltiplos serviços", "O binding não suporta o serviço que você precisa — aí sim use o SDK diretamente"]},
  usecases:[{company:"Sistema de AI",scenario:"Pipeline de embedding sem código de infraestrutura",desc:"Function disparada pelo Service Bus recebe o id do documento. O input binding do Cosmos DB busca o documento automaticamente pelo id. A Function processa e salva o embedding via output binding. Nenhuma linha de código de conexão, autenticação ou SDK escrita pelo dev.",badge:"zero boilerplate"},
  {company:"Sistema de notificações",scenario:"Timer trigger para relatórios diários",desc:"Toda manhã às 8h um timer trigger dispara a Function. O input binding do Cosmos DB busca os pedidos das últimas 24h. A Function gera o resumo. O output binding envia o email via SendGrid (binding disponível). Sem cron jobs, sem servidores de agendamento.",badge:"timer + bindings"},
  {company:"Plataforma de uploads",scenario:"Trigger em Blob para processamento automático",desc:"Usuário faz upload de CSV para o Blob Storage. O blob trigger dispara a Function com o conteúdo do arquivo já injetado via input binding. A Function processa e salva os resultados no Cosmos DB via output binding. O upload é o único passo manual.",badge:"blob trigger"}],
questions:[
{q:"Uma Function deve ler mensagem do Service Bus, buscar doc no Cosmos pelo id da mensagem, e salvar resultado. Como minimizar código de infraestrutura?",a:"Trigger de Service Bus + input binding do Cosmos DB (busca o doc pelo id automaticamente) + output binding do Cosmos DB (salva o resultado). Você escreve apenas a lógica de negócio.",why:null},
{q:"Quantos triggers uma Azure Function pode ter?",a:"Exatamente 1 trigger. Ele define o que dispara a function. Você pode ter múltiplos input e output bindings, mas o trigger é sempre único.",why:null}
]},

{id:"t21",num:"21",domain:"messaging",week:6,title:"Service Bus vs Event Grid vs Event Hubs vs Queue Storage",tag:"Mensageria · Semana 6",tagColor:"g",
summary:"A decisão arquitetural mais cobrada do exame. Saber quando usar cada serviço vale mais que conhecer detalhes de cada um.",
sections:[{title:"Regra de decisão",content:`'Garantia + ordering + transação' → Service Bus
'Reagir a evento do Azure / fan-out' → Event Grid
'Streaming alto volume / Kafka compatibility' → Event Hubs
'Simples, barato, sem requisitos especiais' → Queue Storage`}],
table:{headers:["","Service Bus","Event Grid","Event Hubs","Queue Storage"],rows:[
["Modelo","Message broker","Event router","Event streaming","Queue simples"],
["Garantia","At-least-once","Retry 24h","Retention","At-least-once"],
["Ordering","Sessions (FIFO)","Não","Por partição","Não"],
["Msg máxima","100MB (Premium)","1MB","1MB","64KB"],
["Throughput","Médio","Alto (pequenos)","Muito alto (GB/s)","Baixo"],
["Caso principal","Jobs, transações","Reagir a eventos Azure","Logs, telemetria, Kafka","Desacoplamento simples"]
]},
analogy:null,
tactic:"Crie um cenário de e-commerce e liste todos os fluxos assíncronos (pedido confirmado, estoque baixo, log de acesso, notificação de promoção). Mapeie cada um para o serviço correto. Exercício de decisão é mais eficaz que memorização.",tacticColor:"g",
whenuse:{"tip": true, "items": ["<strong>Service Bus</strong>: garantia de entrega, ordering (Sessions), transações, dead-letter, mensagens > 1MB. Para: pedidos, pagamentos, jobs críticos.", "<strong>Event Grid</strong>: reagir a eventos de serviços Azure, fan-out para N handlers, eventos < 1MB, retry com backoff. Para: pipelines event-driven, orquestração de serviços.", "<strong>Event Hubs</strong>: streaming de altíssimo volume (> 100k eventos/s), Kafka compatibility, retenção configurável para replay. Para: telemetria, logs, dados de IoT.", "<strong>Storage Queue</strong>: desacoplamento simples sem requisitos complexos, mensagens < 64KB, custo mínimo. Para: tarefas de background simples, filas internas de baixo volume.", "<strong>Regra de ouro</strong>: se a palavra 'garantia' aparece no requisito → Service Bus. Se a palavra 'evento' e 'N sistemas' aparecem → Event Grid. Se 'milhões de mensagens/segundo' → Event Hubs."]},
  usecases:[{company:"Plataforma de streaming de dados",scenario:"Ingestão de eventos de cliques de 5M usuários",desc:"5M usuários gerando eventos de cliques, pageviews e interações. Pico de 500.000 eventos/segundo. Event Hubs com 32 partições. Consumido por Azure Stream Analytics para dashboards em tempo real. Service Bus não suportaria esse throughput.",badge:"event hubs streaming"},
  {company:"Sistema de pedidos",scenario:"Garantia de entrega para pedidos críticos",desc:"Pedido feito → mensagem no Service Bus → sistema de fulfillment processa. Se o fulfillment cai, a mensagem espera no Service Bus com lock. Quando volta, processa normalmente. Event Grid não tem garantia de entrega at-least-once com retry por 24h persistente.",badge:"service bus garantia"},
  {company:"Plataforma multi-módulos",scenario:"Notificar 6 sistemas ao confirmar pagamento",desc:"Pagamento confirmado → Event Grid topic → 6 subscriptions reagem: email de confirmação, nota fiscal, estoque, pontos de fidelidade, analytics, anti-fraude. Fan-out para N sistemas com um único evento. Service Bus exigiria 6 filas separadas ou um topic com 6 subscriptions de mesmo custo.",badge:"event grid fan-out"}],
questions:[
{q:"Sistema IoT envia 2 milhões de eventos/segundo de sensores para um pipeline de ML. Qual serviço?",a:"Azure Event Hubs. Projetado para streaming de altíssimo throughput (GB/s), suporta Kafka protocol e tem partições para processamento paralelo.",why:null},
{q:"Um pedido de e-commerce deve ser processado por exatamente um sistema de fulfillment. Sem perda possível. Qual serviço?",a:"Azure Service Bus (queue). Garante entrega at-least-once, tem DLQ para falhas, processamento por exatamente um consumer.",why:null},
{q:"Arquivo criado no Blob Storage. Três Functions diferentes precisam ser notificadas. Qual serviço?",a:"Azure Event Grid. O Blob Storage emite eventos nativamente. Cada Function tem sua própria event subscription. Fan-out automático.",why:null},
{q:"Desacoplamento simples de tarefas de background. Sem requisito de ordering ou alto throughput. Qual é mais custo-eficiente?",a:"Azure Storage Queue. Para desacoplamento simples sem requisitos complexos é o mais barato.",why:null}
]},

// ─── SECURITY ───
{id:"t22",num:"22",domain:"security",week:7,title:"Azure Key Vault",tag:"Segurança · Semana 7",tagColor:"y",
summary:"Cofre centralizado de secrets, keys e certificados. Com Managed Identity, elimina completamente credenciais hardcoded.",
sections:[
{title:"3 tipos de objetos e rotation",content:`Secrets: strings sensíveis (connection strings, API keys, senhas).
Keys: chaves criptográficas para encrypt/decrypt/sign. Com SKU Premium: HSM — a chave nunca sai do hardware.
Certificates: TLS/SSL com renovação automática via DigiCert ou Let's Encrypt.

Versioning e Rotation — cai muito:
Cada save cria uma nova versão. Versões antigas ficam acessíveis mas podem ser desabilitadas.

Rotation sem downtime:
1. Crie nova credencial no banco/serviço.
2. Salve como nova versão do secret (mesmo nome).
3. Apps que buscam getSecret("nome") sem especificar versão usam automaticamente a mais recente.
4. Desabilite a versão comprometida.

Secret vs Key:
Secret = valor opaco (string). Você recupera e usa o valor inteiro.
Key = chave criptográfica. Você pede ao KV para encrypt/decrypt/sign — o valor nunca deixa o cofre.`,
code:`import { DefaultAzureCredential } from "@azure/identity";
import { SecretClient } from "@azure/keyvault-secrets";

// DefaultAzureCredential:
// - No Azure: usa Managed Identity automaticamente
// - Localmente: usa az login
// ZERO credencial no código!
const kv = new SecretClient(
  "https://meu-vault.vault.azure.net",
  new DefaultAzureCredential()
);

// Busca versão mais recente (sem especificar versão)
// Se rotacionar, pega automaticamente a nova
const dbUrl    = (await kv.getSecret("database-url")).value!;
const openaiKey = (await kv.getSecret("openai-key")).value!;

// ❌ NUNCA:
// const dbUrl = "mongodb+srv://user:password@cluster.mongodb.net/";`,lang:"typescript"}
],
analogy:"Key Vault é o cofre de segurança do banco. Seus funcionários (apps) têm chaves do cofre (Managed Identity) para pegar dinheiro (secrets) quando precisam. Você nunca carrega o dinheiro todo no bolso (hardcoded) — só pega o que precisa, com log de tudo.",
tactic:"Coloque uma connection string no Key Vault e refatore uma app para buscá-la via DefaultAzureCredential. Depois revogue o acesso da Managed Identity e observe o erro 403. Ver 'Forbidden' te ensina como a autorização realmente funciona.",tacticColor:"y",
whenuse:{"yes": ["Qualquer string sensível que não deve aparecer em código, logs ou portal (connection strings, API keys, senhas)", "Você precisa de rotation de credenciais sem downtime e com histórico de versões", "Chaves criptográficas que nunca devem sair do hardware (use Keys com HSM no SKU Premium)", "Certificados TLS com renovação automática"], "no": ["Configurações não-sensíveis (feature flags, timeouts, nomes de modelos) — use App Configuration", "Você precisa de configuração dinâmica sem restart (Key Vault não tem dynamic refresh nativo — use App Configuration com referência ao KV)", "Dados de aplicação — Key Vault é para segredos, não para armazenar dados de negócio"]},
  usecases:[{company:"Fintech",scenario:"Rotation de credenciais sem downtime",desc:"Todo trimestre, as credenciais do banco de dados são rotacionadas por compliance. O processo: criar nova senha no banco → salvar nova versão no Key Vault (mesmo nome) → desabilitar versão antiga. As APIs que buscam o secret sem versão específica pegam a nova automaticamente. Zero restart de serviços.",badge:"rotation zero downtime"},
  {company:"Empresa de saúde",scenario:"Chaves de criptografia em HSM para dados de pacientes",desc:"Dados de prontuários são criptografados com Keys (não Secrets) do Key Vault Premium com HSM. A aplicação pede ao Key Vault para criptografar/descriptografar — a chave nunca sai do hardware. Mesmo que alguém roube o código-fonte, não há chave para decriptar os dados.",badge:"hsm key vault"},
  {company:"Startup SaaS",scenario:"Auditoria de quem acessou quais secrets",desc:"O Key Vault registra cada acesso a cada secret com: qual identidade acessou, de qual IP, quando e qual versão. O time de segurança detectou que um Container App estava acessando um secret de produção 5.000 vezes/hora (bug de loop) antes que causasse problemas.",badge:"audit log"}],
questions:[
{q:"Uma connection string foi vazada. Você precisa rotacioná-la sem interromper o serviço. Como?",a:"1. Crie nova connection string no banco. 2. Salve como nova versão do secret (mesmo nome). 3. Apps sem versão específica usam automaticamente a mais recente. 4. Desabilite a versão comprometida.",why:null},
{q:"Qual role RBAC atribuir a uma Managed Identity para ler secrets do Key Vault?",a:"Key Vault Secrets User (leitura). Para criar/atualizar: Key Vault Secrets Officer. O role precisa ser atribuído no escopo do Key Vault.",why:null},
{q:"Qual a diferença entre Secret e Key no Key Vault?",a:"Secret = valor opaco (string) — você recupera e usa o valor inteiro (para connection strings e API keys). Key = chave criptográfica — você pede ao Key Vault para realizar operações criptográficas sem que o valor da chave deixe o cofre.",why:null}
]},

{id:"t23",num:"23",domain:"security",week:7,title:"Managed Identity",tag:"Segurança · Semana 7",tagColor:"y",
summary:"A solução para eliminar credenciais do código. O Azure gerencia o service principal automaticamente.",
sections:[
{title:"Como funciona e system vs user-assigned",content:`Ao habilitar Managed Identity, o Azure cria um service principal no Entra ID vinculado ao recurso. O recurso obtém tokens OAuth automaticamente sem client_id + client_secret no código.

DefaultAzureCredential detecta automaticamente:
- No Azure: usa Managed Identity (IMDS endpoint).
- Localmente: tenta variáveis de ambiente → Azure CLI → VS Code → Azure PowerShell.
O mesmo código funciona nos dois ambientes sem modificação.

System-assigned: criada e deletada com o recurso. 1 recurso → 1 identity. Simples.
User-assigned: recurso independente, associada a múltiplos recursos. Ideal para múltiplos serviços com as mesmas permissões.

Role Assignments necessários:
- Key Vault: Key Vault Secrets User
- Cosmos DB: Cosmos DB Built-in Data Contributor
- Service Bus: Azure Service Bus Data Sender/Receiver
- Storage: Storage Blob Data Contributor
- ACR: AcrPull`}
],
analogy:"Managed Identity é como um crachá corporativo eletrônico. O funcionário (app) não precisa saber a senha do sistema — o crachá (identity) é reconhecido automaticamente. Se demitido (recurso deletado com system-assigned), o crachá é desativado. Vários funcionários podem compartilhar um tipo de crachá (user-assigned).",
tactic:"Remova TODAS as credenciais de uma app e configure tudo via Managed Identity. Teste localmente com az login. Faça deploy no Azure e veja funcionar sem nenhuma senha em lugar nenhum. Esse momento é revelador.",tacticColor:"y",
whenuse:{"yes": ["Qualquer recurso Azure que precisa acessar outro serviço Azure sem credenciais hardcoded", "Substitui client_id + client_secret em todo lugar — use DefaultAzureCredential", "Múltiplos serviços com as mesmas permissões (use User-assigned para não duplicar role assignments)", "Ambientes de desenvolvimento: DefaultAzureCredential funciona com az login localmente, sem variáveis de ambiente"], "no": ["Aplicações fora do Azure (on-premises, outras nuvens) — Managed Identity só funciona em recursos Azure", "Cenários onde você precisa de uma identidade para um usuário específico (use Azure AD tokens de usuário)", "Service principals com múltiplos tenants ou acesso cross-subscription complexo — às vezes user-assigned com configuração manual é mais claro"]},
  usecases:[{company:"Empresa de AI",scenario:"Container App sem nenhuma credencial em código",desc:"O app Node.js usa DefaultAzureCredential. No Azure, usa automaticamente a Managed Identity do Container App para acessar: Key Vault (secrets), Cosmos DB (dados), Service Bus (mensagens) e ACR (imagens). Nenhuma variável de ambiente com senha. O código é idêntico em dev (az login) e produção.",badge:"zero credentials"},
  {company:"Plataforma multi-tenant",scenario:"5 microservices com as mesmas permissões",desc:"User-assigned Managed Identity criada uma vez com roles: Key Vault Secrets User, Cosmos DB Built-in Data Contributor e Service Bus Data Sender. Associada aos 5 Container Apps. Quando um novo serviço é criado, é só associar a mesma identity — sem criar novos roles.",badge:"user-assigned"},
  {company:"Pipeline de dados",scenario:"Azure Function acessando PostgreSQL privado",desc:"Function no plano Premium com VNet integration. Managed Identity tem role no PostgreSQL Flexible Server. A connection string do banco fica no Key Vault — a Function a busca via DefaultAzureCredential. Nenhuma senha em código, variável de ambiente ou configuração do App Service.",badge:"sem senha no código"}],
questions:[
{q:"Como uma Container App acessa o Cosmos DB sem nenhuma credencial no código?",a:"1. Habilite Managed Identity (system-assigned) na Container App. 2. Atribua o role 'Cosmos DB Built-in Data Contributor' à identity. 3. Use DefaultAzureCredential no código. Nenhuma chave necessária.",why:null},
{q:"5 Container Apps precisam das mesmas permissões no Key Vault e Service Bus. Qual tipo de Managed Identity?",a:"User-assigned Managed Identity. Crie uma identity, atribua os roles necessários, e associe essa mesma identity a todos os 5 Container Apps.",why:null},
{q:"Como DefaultAzureCredential autentica no Azure vs localmente?",a:"No Azure: usa automaticamente a Managed Identity do recurso (IMDS endpoint). Localmente: tenta variáveis de ambiente → Azure CLI (az login) → VS Code credentials → Azure PowerShell. O mesmo código funciona nos dois ambientes.",why:null}
]},

{id:"t24",num:"24",domain:"security",week:7,title:"Azure App Configuration",tag:"Segurança · Semana 7",tagColor:"y",
summary:"Configurações centralizadas e feature flags. Complementa o Key Vault — KV guarda segredos, App Config guarda configurações e flags.",
sections:[
{title:"Labels, Feature Flags e Dynamic Refresh",content:`Labels para múltiplos ambientes:
Mesma chave com valores diferentes por label. 'max-tokens | dev = 100' e 'max-tokens | prod = 4000'. A app busca com seu label de ambiente. Sem arquivos .env por ambiente.

Feature Flags:
- On/Off: habilitar/desabilitar para todos sem deploy.
- Percentage filter: habilitar para X% dos usuários (canary release).
- Targeting filter: habilitar para grupos específicos.
- Time window: habilitar apenas em horários definidos.

Dynamic Refresh + Sentinel key:
A app verifica mudanças periodicamente (sem restart). A sentinel key — quando alterada, a app detecta e recarrega todas as configurações.

Key Vault vs App Config:
Key Vault: dados SENSÍVEIS (passwords, connection strings, API keys).
App Config: configurações NÃO-sensíveis (feature flags, timeouts, model names, thresholds).`}
],

{id:"t25",num:"25",domain:"observability",week:8,title:"OpenTelemetry",tag:"Observabilidade · Semana 8",tagColor:"y",
summary:"Padrão open-source de observabilidade. Substitui o SDK proprietário do Application Insights. Novo vs AZ-204.",
sections:[
{title:"Os 3 pilares e Context Propagation",content:`Trace: caminho completo de uma request pelo sistema distribuído. Contém múltiplos spans, correlacionados por um traceId único.

Span: operação com duração (início, fim, nome, status, atributos). Spans são aninhados — o span pai (HTTP request) contém spans filhos (query ao banco, chamada ao OpenAI).

Metric: medida numérica ao longo do tempo. Contador, gauge, histograma.

Log: evento discreto. O OTel conecta logs a traces automaticamente via traceId/spanId.

Context propagation: o traceId viaja entre serviços via header HTTP 'traceparent' (W3C Trace Context). Permite correlacionar todos os spans de uma request que passou por 5 serviços.

OpenTelemetry vs SDK do Application Insights:
SDK do AppInsights: proprietário da Microsoft, só envia para Azure Monitor.
OpenTelemetry: open-source, vendor-neutral — envia para Azure Monitor, Jaeger, Datadog. É o padrão da indústria.`,
code:`// telemetry.ts — importe ANTES de qualquer outro import
import { NodeSDK } from "@opentelemetry/sdk-node";
import { AzureMonitorTraceExporter } from "@azure/monitor-opentelemetry-exporter";
import { getNodeAutoInstrumentations } from "@opentelemetry/auto-instrumentations-node";
import { Resource } from "@opentelemetry/resources";

const sdk = new NodeSDK({
  resource: new Resource({ "service.name": "ai-api" }),
  traceExporter: new AzureMonitorTraceExporter({
    connectionString: process.env.APPLICATIONINSIGHTS_CONNECTION_STRING
    // Sempre Connection String — nunca Instrumentation Key (legado)
  }),
  instrumentations: [getNodeAutoInstrumentations()]
  // Auto-instrumenta: Express, HTTP, pg, redis, @azure/cosmos
});
sdk.start();

// Span customizado para operações importantes
import { trace, SpanStatusCode } from "@opentelemetry/api";
const tracer = trace.getTracer("ai-api");

async function tracedVectorSearch(emb: number[]) {
  return tracer.startActiveSpan("pg.vector_search", async (span) => {
    span.setAttributes({ "vector.dimensions": emb.length });
    try {
      const results = await vectorSearch(emb);
      span.setStatus({ code: SpanStatusCode.OK });
      return results;
    } catch (e) {
      span.setStatus({ code: SpanStatusCode.ERROR, message: String(e) });
      throw e;
    } finally {
      span.end(); // SEMPRE no finally!
    }
  });
}`,lang:"typescript"}
],
analogy:"OpenTelemetry é como o sistema de rastreamento dos Correios. Cada encomenda (request) recebe um código de rastreio (traceId). Cada entregador que toca a encomenda (serviço) registra onde ela estava e quanto tempo ficou (spans). Você vê o percurso completo de ponta a ponta.",
tactic:"Instrumente uma API com getNodeAutoInstrumentations() e faça algumas requests. No Application Insights, abra o Application Map e o End-to-end transaction. Ver o trace visual de uma request passando por 3 serviços é a melhor explicação possível de distributed tracing.",tacticColor:"y",
whenuse:{"yes": ["Você precisa rastrear o caminho completo de uma request em um sistema distribuído (múltiplos serviços, Functions, DBs)", "Você quer instrumentar Node.js automaticamente sem escrever código de trace para cada biblioteca", "Você precisa de vendor-neutral observability (exportar para Azure Monitor E/OU Datadog/Jaeger)", "Medir latência de operações específicas como vector search, chamadas ao OpenAI, queries ao banco"], "no": ["Você tem um app monolítico simples onde Application Insights SDK clássico já está funcionando — migrar não traz benefício imediato", "Você só precisa de métricas básicas de HTTP — o Azure Monitor já coleta automaticamente sem instrumentação manual"]},

  {company:"Fintech com microservices",scenario:"Correlacionar erro em 1 de 7 serviços",desc:"Usuário reporta erro ao fazer transferência. O suporte pega o traceId do log de erro do usuário. No Log Analytics: union requests, dependencies, exceptions | where operation_Id == traceId. Em 2 minutos, o dev vê que o erro aconteceu exatamente no serviço de compliance, no span 'db.query', com mensagem 'deadlock detected'.",badge:"end-to-end trace"},

{id:"t26",num:"26",domain:"observability",week:8,title:"KQL — Kusto Query Language",tag:"Observabilidade · Semana 8",tagColor:"y",
summary:"Linguagem de query do Azure Monitor e Log Analytics. Você precisa escrever e interpretar queries para analisar logs em produção.",
sections:[
{title:"Operadores essenciais e tabelas",content:`Tabelas do Application Insights:
- requests: requests HTTP recebidas. Campos: name, duration, success, resultCode.
- dependencies: chamadas externas (banco, APIs, Service Bus). Campos: target, name, duration, success, type.
- exceptions: exceções. Campos: type, outerMessage, details.
- traces: logs da app. Campos: message, severityLevel.
- customMetrics: métricas do OpenTelemetry.

Operadores essenciais:
- where: filtrar. Ex: where success == false
- summarize: agregar. Ex: summarize count(), avg(duration) by name
- project: selecionar colunas.
- top N by / order by: ordenar.
- ago(1h): tempo relativo. Ex: where timestamp > ago(24h)
- bin(timestamp, 5m): agrupar em buckets de tempo.
- render timechart: visualizar como gráfico.
- union: combinar tabelas. Ex: union requests, dependencies.
- countif: contar com condição.`,
code:`// 1. Taxa de erro por endpoint (últimas 24h)
requests
| where timestamp > ago(24h)
| summarize total=count(), erros=countif(success==false) by name
| extend taxaErro = (erros * 100.0 / total)
| order by taxaErro desc

// 2. Latência P50/P95/P99 por hora
requests
| where timestamp > ago(6h)
| summarize p50=percentile(duration,50),
            p95=percentile(duration,95),
            p99=percentile(duration,99)
  by bin(timestamp,1h)
| render timechart

// 3. Rastrear request por operationId (trace distribuído)
let op = "abc123traceId";
union requests, dependencies, exceptions, traces
| where operation_Id == op
| order by timestamp asc

// 4. Top 5 dependências com mais falhas
dependencies
| where timestamp > ago(1h) and success == false
| summarize falhas=count() by target, type
| top 5 by falhas

// 5. Exceções recentes
exceptions
| where timestamp > ago(1h)
| project timestamp, type, outerMessage
| order by timestamp desc | take 20

// 6. Tokens LLM por hora (custom metric do OpenTelemetry)
customMetrics
| where name == "llm.tokens_used"
| summarize tokens=sum(value) by bin(timestamp,1h)
| render columnchart`,lang:"kql"}
],
analogy:"KQL é como SQL, mas para logs. Se você sabe SELECT, WHERE, GROUP BY, você já sabe 70% do KQL. O pipe (|) substitui o encadeamento de CTEs — cada operador transforma o resultado do anterior.",
tactic:"Abra o Log Analytics no portal Azure e execute as 6 queries acima. Depois tente escrever do zero: 'quais são os 3 endpoints mais lentos desta semana?' sem olhar as respostas. Escrever é mais eficaz que ler.",tacticColor:"y",
whenuse:{"yes": ["Investigar lentidão ou erros reportados por usuários (buscar por operationId para ver o trace completo)", "Criar alertas baseados em métricas customizadas (p95 de latência, taxa de erro, tokens consumidos)", "Analisar padrões de uso: quais endpoints são mais usados, quais são mais lentos, qual horário tem mais carga", "Auditar custos de IA: somar tokens consumidos por endpoint, por modelo, por período"], "no": ["Você só quer ver métricas básicas de disponibilidade — o portal do Application Insights já tem dashboards visuais prontos", "Análises muito simples de um único campo — o portal tem filtros visuais que são mais rápidos que escrever KQL"]},
  usecases:[{company:"E-commerce",scenario:"Investigar lentidão relatada por usuários",desc:"Usuários reclamam de lentidão no checkout. Query KQL: requests | where name contains 'checkout' | summarize p95=percentile(duration,95) by bin(timestamp,10m) | render timechart. O gráfico mostra pico de 8 segundos às 14h. Cruzando com dependencies, o culpado é a query de validação de cupom sem índice.",badge:"latency analysis"},
  {company:"Plataforma de AI",scenario:"Monitorar custo de tokens em tempo real",desc:"customMetrics | where name == 'llm.tokens_used' | summarize total=sum(value) by bin(timestamp,1h) | render columnchart. O time vê que às 16h o consumo dobrou. Cruzando com requests, identificam um novo endpoint que não usa semantic cache — gerando chamadas duplicadas ao OpenAI.",badge:"cost monitoring"},
  {company:"Sistema de pagamentos",scenario:"Rastrear transação específica com erro",desc:"Cliente reporta que transferência 'TXN-9812' falhou. Query: union requests, dependencies, exceptions | where operation_Id == 'TXN-9812' | order by timestamp asc. Em 30 segundos, o dev vê toda a sequência: a request chegou, a validação passou, o erro aconteceu na hora de escrever no banco — 'constraint violation no campo account_id'.",badge:"transaction trace"}],

{id:"t27",num:"27",domain:"observability",week:8,title:"Application Insights",tag:"Observabilidade · Semana 8",tagColor:"y",
summary:"APM do Azure Monitor. Recebe dados do OpenTelemetry e provê dashboards, alertas, Application Map e análise de performance.",
sections:[
{title:"Features importantes para o exame",content:`Application Map: mapa visual automático de todas as dependências. Mostra latência média e taxa de erro de cada conexão. O primeiro lugar para ir quando há degradação.

Availability Tests:
- Standard test: requests HTTP para sua URL de múltiplas regiões Azure a cada 5 min. Alerta quando disponibilidade cai.
- Custom TrackAvailability: você escreve o teste customizado (ex: fluxo de login completo).

Smart Detection: detecta automaticamente anomalias de performance e falhas.

Live Metrics: stream em tempo real de requests, failures e performance. Para troubleshoot ao vivo.

Sampling: em alto volume, instrumentar 100% gera custo alto.
Adaptive sampling (padrão): ajusta automaticamente baseado no volume.
Atenção: pode omitir erros raros.

Connection String vs Instrumentation Key:
Use sempre Connection String via APPLICATIONINSIGHTS_CONNECTION_STRING. O Instrumentation Key é legado e será depreciado.`}
],
