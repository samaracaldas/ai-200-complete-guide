<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-200 — Guia Completo de Estudos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#06060f;--sur:#0d0d1c;--card:#111120;--card2:#161628;
  --bor:#1e1e35;--bor2:#2a2a46;
  --a:#5b8fff;--a2:#a78bfa;--a3:#34d399;--w:#fbbf24;--r:#f87171;
  --t:#e8e8f4;--m:#6a6a98;--m2:#9898c8;--cb:#080814;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--t);font-family:'Inter',sans-serif;line-height:1.7;display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:268px;flex-shrink:0;background:var(--sur);border-right:1px solid var(--bor);height:100vh;position:sticky;top:0;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--bor2) transparent;}
#sidebar::-webkit-scrollbar{width:3px;}
#sidebar::-webkit-scrollbar-thumb{background:var(--bor2);}
.sb-head{padding:18px 16px 12px;border-bottom:1px solid var(--bor);}
.sb-logo{font-size:17px;font-weight:800;color:var(--a);font-family:'JetBrains Mono',monospace;}
.sb-sub{font-size:10px;color:var(--m);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.sb-prog{margin:10px 13px;background:var(--card);border:1px solid var(--bor);border-radius:7px;padding:9px 11px;}
.sb-prog-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--m);font-family:'JetBrains Mono',monospace;margin-bottom:5px;}
.sb-bar{height:4px;background:var(--bor2);border-radius:2px;overflow:hidden;}
.sb-fill{height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:2px;width:0%;transition:width .4s;}
.sb-prog-txt{font-size:10px;color:var(--m2);margin-top:4px;font-family:'JetBrains Mono',monospace;}
.sb-search{margin:4px 12px 8px;position:relative;}
.sb-search input{width:100%;background:var(--card);border:1px solid var(--bor2);border-radius:6px;padding:7px 10px 7px 28px;font-size:11px;color:var(--t);font-family:'Inter',sans-serif;outline:none;}
.sb-search input:focus{border-color:rgba(91,143,255,.4);}
.sb-search input::placeholder{color:var(--m);}
.sb-si{position:absolute;left:9px;top:8px;color:var(--m);font-size:12px;pointer-events:none;}
.sb-body{flex:1;overflow-y:auto;padding-bottom:20px;}
.sb-grp{padding:11px 16px 3px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--m);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:5px;}
.sb-grp::after{content:'';flex:1;height:1px;background:var(--bor);}
.sb-item{display:flex;align-items:center;gap:7px;padding:5px 16px;font-size:11px;color:var(--m2);cursor:pointer;border-left:2px solid transparent;transition:all .15s;text-decoration:none;}
.sb-item:hover{background:rgba(91,143,255,.06);color:var(--t);}
.sb-item.active{background:rgba(91,143,255,.09);color:var(--a);border-left-color:var(--a);}
.sb-chk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--bor2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;cursor:pointer;transition:all .2s;}
.sb-chk.done{background:rgba(52,211,153,.15);border-color:var(--a3);color:var(--a3);}
.sb-num{font-size:9px;color:var(--m);font-family:'JetBrains Mono',monospace;min-width:16px;}
.sb-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

/* CONTENT */
#content{flex:1;min-width:0;}
.c-inner{max-width:780px;padding:44px 44px 100px;margin:0 auto;}

/* HERO */
.hero{background:linear-gradient(145deg,#09091c,#0b0a1e);border:1px solid var(--bor);border-radius:14px;padding:30px 34px;margin-bottom:40px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-50px;right:-50px;width:260px;height:260px;background:radial-gradient(circle,rgba(91,143,255,.08),transparent 70%);pointer-events:none;}
.hero-ey{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a);font-family:'JetBrains Mono',monospace;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.hero-ey::before{content:'';width:18px;height:1px;background:var(--a);}
.hero h1{font-size:clamp(22px,4vw,34px);font-weight:800;line-height:1.1;margin-bottom:11px;letter-spacing:-.4px;}
.hero h1 span{background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-desc{font-size:13px;color:var(--m2);line-height:1.8;max-width:540px;margin-bottom:22px;}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;}
.hstat{background:rgba(255,255,255,.03);border:1px solid var(--bor);border-radius:9px;padding:10px 15px;text-align:center;}
.hstat-v{font-size:20px;font-weight:800;color:var(--a);}
.hstat-l{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.07em;font-family:'JetBrains Mono',monospace;margin-top:2px;}

/* HOW TO */
.how-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px;margin-bottom:10px;}
.how-card{background:var(--card);border:1px solid var(--bor);border-radius:9px;padding:13px;}
.how-icon{font-size:19px;margin-bottom:7px;}
.how-title{font-size:11px;font-weight:700;margin-bottom:3px;}
.how-desc{font-size:11px;color:var(--m);line-height:1.5;}

/* SECTION TITLE */
.sec-title{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--m);font-family:'JetBrains Mono',monospace;padding:6px 0 12px;margin-top:48px;border-bottom:1px solid var(--bor);}

/* TOPIC */
.topic{scroll-margin-top:18px;margin-bottom:52px;}
.topic-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px;}
.topic-num{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:800;color:var(--bor2);line-height:1;flex-shrink:0;min-width:46px;}
.topic-meta{flex:1;}
.topic-tag{display:inline-flex;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:3px;margin-bottom:6px;}
.tag-b{background:rgba(91,143,255,.13);color:var(--a);}
.tag-p{background:rgba(167,139,250,.13);color:var(--a2);}
.tag-g{background:rgba(52,211,153,.13);color:var(--a3);}
.tag-y{background:rgba(251,191,36,.13);color:var(--w);}
.topic h2{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.3px;margin-bottom:5px;}
.topic-sum{font-size:13px;color:var(--m2);line-height:1.75;}
.done-btn{flex-shrink:0;width:28px;height:28px;border-radius:6px;border:1.5px solid var(--bor2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bor2);transition:all .2s;}
.done-btn.done{border-color:var(--a3);background:rgba(52,211,153,.15);color:var(--a3);}

/* BLOCK TITLE */
.blk-t{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--m);font-family:'JetBrains Mono',monospace;margin:18px 0 9px;display:flex;align-items:center;gap:7px;}
.blk-t::after{content:'';flex:1;height:1px;background:var(--bor);}

/* CONCEPT BOX */
.cb{background:var(--card);border:1px solid var(--bor);border-radius:9px;padding:15px 18px;margin-bottom:10px;}
.cb h4{font-size:13px;font-weight:700;margin-bottom:7px;}
.cb p{font-size:12px;color:#9898c8;line-height:1.8;white-space:pre-line;}

/* CODE */
.code-wrap{background:var(--cb);border:1px solid var(--bor2);border-radius:9px;overflow:hidden;margin:11px 0;}
.code-head{display:flex;align-items:center;padding:7px 13px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--bor);}
.code-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--m);font-family:'JetBrains Mono',monospace;}
.code-dots{display:flex;gap:4px;margin:0 8px 0 auto;}
.code-dot{width:7px;height:7px;border-radius:50%;}
.copy-btn{background:none;border:1px solid var(--bor2);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--m);cursor:pointer;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;transition:color .2s;}
.copy-btn:hover{color:var(--a3);}
.code-wrap pre{padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.75;overflow-x:auto;color:#c0c8ee;margin:0;}

/* TABLE */
.tw{background:var(--card);border:1px solid var(--bor);border-radius:9px;overflow:hidden;margin:10px 0;}
.tw table{width:100%;border-collapse:collapse;font-size:11px;}
.tw th{background:var(--card2);color:var(--m2);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;padding:9px 12px;text-align:left;border-bottom:2px solid var(--bor2);}
.tw td{padding:8px 12px;border-bottom:1px solid var(--bor);color:#9090c0;vertical-align:top;line-height:1.5;}
.tw tr:last-child td{border-bottom:none;}
.tw td:first-child{color:var(--t);font-weight:600;}

/* BOXES */
.box{border-radius:8px;padding:13px 15px;margin:10px 0;font-size:12px;line-height:1.7;}
.box-lbl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:7px;}
.b-b{background:rgba(91,143,255,.06);border:1px solid rgba(91,143,255,.18);}
.b-b .box-lbl{color:var(--a);}
.b-b p{color:#8888b8;}
.b-y{background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.18);}
.b-y .box-lbl{color:var(--w);}
.b-y p{color:#a09060;}
.b-g{background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.18);}
.b-g .box-lbl{color:var(--a3);}
.b-g p{color:#70a088;}

/* ANALOGY */
.analogy{background:linear-gradient(135deg,rgba(91,143,255,.06),rgba(167,139,250,.06));border:1px solid rgba(167,139,250,.2);border-radius:9px;padding:13px 16px;margin:10px 0;}
.analogy .al{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a2);font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
.analogy p{font-size:12px;color:#a898c8;line-height:1.75;}

/* TACTIC */
.tactic{border-radius:9px;padding:13px 15px;margin:10px 0;border-left-width:3px;border-left-style:solid;}
.tactic .tl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
.tactic p{font-size:12px;color:#8888b8;line-height:1.7;}

/* QUESTIONS */
.qs{background:var(--card);border:1px solid var(--bor);border-radius:11px;overflow:hidden;margin:12px 0;}
.qs-head{background:rgba(248,113,113,.07);border-bottom:1px solid rgba(248,113,113,.18);padding:9px 16px;display:flex;align-items:center;gap:7px;}
.qs-lbl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--r);font-family:'JetBrains Mono',monospace;}
.qs-badge{background:rgba(248,113,113,.2);color:var(--r);font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;margin-left:auto;}
.question{border-bottom:1px solid var(--bor);}
.question:last-child{border-bottom:none;}
.q-btn{width:100%;background:none;border:none;padding:12px 16px;text-align:left;cursor:pointer;display:flex;align-items:flex-start;gap:10px;}
.q-btn:hover{background:rgba(255,255,255,.02);}
.q-n{font-size:9px;font-weight:800;color:var(--r);font-family:'JetBrains Mono',monospace;min-width:20px;margin-top:2px;flex-shrink:0;}
.q-text{font-size:12px;color:var(--t);line-height:1.6;flex:1;text-align:left;}
.q-arr{color:var(--m);font-size:10px;margin-top:3px;transition:transform .2s;flex-shrink:0;}
.q-ans{display:none;padding:0 16px 14px 46px;}
.q-ans-box{background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.18);border-radius:7px;padding:11px 13px;}
.q-ans-lbl{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--a3);font-family:'JetBrains Mono',monospace;margin-bottom:5px;}
.q-ans-txt{font-size:12px;color:#80a898;line-height:1.7;}
.q-why{margin-top:7px;font-size:11px;color:var(--m);line-height:1.6;font-style:italic;}



/* QUANDO USAR */
.wu-wrap{margin:10px 0;}
.wu-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.wu-col{background:var(--card);border:1px solid var(--bor);border-radius:9px;padding:14px 16px;}
.wu-col-title{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.wu-yes .wu-col-title{color:var(--a3);}
.wu-no  .wu-col-title{color:var(--r);}
.wu-list{list-style:none;display:flex;flex-direction:column;gap:6px;}
.wu-list li{font-size:12px;line-height:1.55;padding-left:16px;position:relative;color:var(--m2);}
.wu-list li::before{position:absolute;left:0;font-size:11px;}
.wu-yes .wu-list li::before{content:'✓';color:var(--a3);}
.wu-no  .wu-list li::before{content:'✗';color:var(--r);}
.wu-list li strong{color:var(--t);}
.wu-single{background:var(--card);border:1px solid var(--bor);border-radius:9px;padding:14px 16px;margin-top:10px;}
.wu-single .wu-list li::before{content:'→';color:var(--a);}
@media(max-width:600px){.wu-cols{grid-template-columns:1fr;}}
.wu-single .wu-list li::before{content:'→';color:var(--a);}
.wu-single.wu-b .wu-list li::before{color:var(--a);}
.wu-single.wu-p .wu-list li::before{color:var(--a2);}
.wu-single.wu-g .wu-list li::before{color:var(--a3);}
.wu-single.wu-y .wu-list li::before{color:var(--w);}


/* USE CASES */
.uc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0;}
.uc-card{background:var(--card);border:1px solid var(--bor);border-radius:9px;padding:14px 16px;position:relative;overflow:hidden;}
.uc-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:2px 0 0 2px;}
.uc-b::before{background:var(--a);}
.uc-p::before{background:var(--a2);}
.uc-g::before{background:var(--a3);}
.uc-y::before{background:var(--w);}
.uc-company{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:5px;}
.uc-b .uc-company{color:var(--a);}
.uc-p .uc-company{color:var(--a2);}
.uc-g .uc-company{color:var(--a3);}
.uc-y .uc-company{color:var(--w);}
.uc-scenario{font-size:12px;font-weight:700;color:var(--t);margin-bottom:5px;line-height:1.4;}
.uc-desc{font-size:11px;color:var(--m2);line-height:1.6;}
.uc-badge{display:inline-flex;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:6px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
.uc-b .uc-badge{background:rgba(91,143,255,.13);color:var(--a);}
.uc-p .uc-badge{background:rgba(167,139,250,.13);color:var(--a2);}
.uc-g .uc-badge{background:rgba(52,211,153,.13);color:var(--a3);}
.uc-y .uc-badge{background:rgba(251,191,36,.13);color:var(--w);}



/* RESOURCE CARDS */
.res-card{display:block;background:var(--card);border:1px solid var(--bor);border-radius:10px;
  padding:16px;text-decoration:none;transition:border-color .2s,background .2s;cursor:pointer;}
.res-card:hover{border-color:rgba(91,143,255,.4);background:rgba(91,143,255,.04);}
.res-main{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.04);}
.res-main:hover{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.07);}
.res-icon{font-size:20px;margin-bottom:8px;}
.res-name{font-size:13px;font-weight:700;color:var(--t);margin-bottom:4px;line-height:1.3;}
.res-desc{font-size:11px;color:var(--m);line-height:1.5;margin-bottom:8px;}
.res-tag{display:inline-flex;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;
  background:rgba(91,143,255,.12);color:var(--a);font-family:'JetBrains Mono',monospace;
  text-transform:uppercase;letter-spacing:.06em;}
.res-main .res-tag{background:rgba(52,211,153,.12);color:var(--a3);}

/* FOOTER */
.site-footer{margin-top:80px;padding:40px 0 60px;border-top:1px solid var(--bor);display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;}
.footer-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0;}
.footer-name{font-size:18px;font-weight:800;color:var(--t);letter-spacing:-.3px;}
.footer-role{font-size:12px;color:var(--m);font-family:'JetBrains Mono',monospace;margin-top:3px;}
.footer-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
.footer-link{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 12px;border-radius:6px;text-decoration:none;border:1px solid var(--bor2);color:var(--m2);transition:all .2s;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;}
.footer-link:hover{border-color:var(--a);color:var(--a);background:rgba(91,143,255,.07);}
.footer-divider{width:40px;height:1px;background:var(--bor2);}
.footer-copy{font-size:11px;color:var(--m);font-family:'JetBrains Mono',monospace;line-height:1.6;}

/* MOBILE */

/* ── HAMBURGER BUTTON (só aparece no mobile) ── */
#sb-toggle{display:none;position:fixed;top:12px;right:14px;z-index:200;
  background:var(--card);border:1px solid var(--bor2);border-radius:8px;
  width:40px;height:40px;cursor:pointer;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;box-shadow:0 2px 12px rgba(0,0,0,.3);}
#sb-toggle span{display:block;width:18px;height:1.5px;background:var(--t);
  border-radius:2px;transition:all .25s;}
#sb-toggle.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
#sb-toggle.open span:nth-child(2){opacity:0;transform:scaleX(0);}
#sb-toggle.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

/* ── OVERLAY ── */
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:150;backdrop-filter:blur(2px);}

@media(max-width:760px){
  /* Layout */
  body{flex-direction:column;}

  /* Sidebar vira drawer deslizante */
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;width:280px;
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    z-index:160;border-right:1px solid var(--bor2);
  }
  #sidebar.open{transform:translateX(0);}
  #sb-overlay.open{display:block;}
  #sb-toggle{display:flex;}

  /* Content ocupa tudo */
  #content{width:100%;min-width:0;}
  .c-inner{padding:64px 16px 60px;}

  /* Tipografia fluida */
  .hero h1{font-size:clamp(20px,6vw,30px);}
  .topic h2{font-size:clamp(17px,5vw,22px);}
  .topic-num{font-size:20px;min-width:32px;}
  .topic-sum{font-size:12px;}

  /* Hero stats empilham */
  .hero-stats{gap:8px;}
  .hstat{padding:8px 12px;}
  .hstat-v{font-size:17px;}

  /* How-to grid colapsa */
  .how-grid{grid-template-columns:1fr 1fr;}

  /* Seções */
  .sec-title{margin-top:32px;}

  /* Code scroll horizontal */
  .code-wrap pre{font-size:10px;}
  .code-wrap{overflow-x:auto;}

  /* Tabelas scrolláveis */
  .tw{overflow-x:auto;}
  .tw table{min-width:480px;}

  /* Wu columns empilham */
  .wu-cols{grid-template-columns:1fr;}

  /* Usecase grid colapsa */
  .uc-grid{grid-template-columns:1fr;}

  /* Questions padding menor */
  .q-ans{padding:0 12px 12px 36px;}
  .q-btn{padding:10px 12px;}

  /* Topic top */
  .topic-top{gap:10px;}

  /* Blk title */
  .blk-t{font-size:9px;}

  /* cb padding menor */
  .cb{padding:12px 14px;}
  .cb p{font-size:11px;}

  /* Analogy */
  .analogy p{font-size:11px;}

  /* Tactic */
  .tactic p{font-size:11px;}

  /* Footer */

{id:"t1",num:"01",domain:"containers",week:1,title:"Azure Container Registry (ACR)",tag:"Containers · Semana 1",tagColor:"b",
summary:"Repositório privado de imagens Docker integrado nativamente com todos os serviços Azure via Managed Identity — sem senhas.",
sections:[
{title:"O que é e por que usar",content:`O ACR é o Docker Hub privado da Microsoft dentro da sua assinatura Azure. Mantém tudo dentro da sua conta, na mesma região dos seus serviços, com controle de acesso por RBAC e integração com Managed Identity.

SKUs: Basic (dev/teste), Standard (produção, webhooks), Premium (geo-replication, private link — use quando Container Apps em múltiplas regiões precisam puxar imagens localmente).`},
{title:"ACR Tasks — o tópico favorito do exame",content:`ACR Tasks automatiza builds no Azure, sem servidor de CI. 3 tipos de trigger:

Quick task (az acr build): build on-demand sem Docker local.
Git commit trigger: a cada push no GitHub/ADO, o ACR reconstrói a imagem.
Base image update trigger: quando a imagem base (ex: node:20-alpine) recebe update, sua imagem é reconstruída automaticamente. Este é o cenário mais cobrado.`,
code:`# Criar ACR
az acr create --name meuacr --resource-group rg-ai200 --sku Standard

# Build sem Docker local (quick task)
az acr build --registry meuacr --image minhaapi:v1 .

# Task com base image trigger
az acr task create \\
  --name rebuild-on-base --registry meuacr \\
  --image minhaapi:{{.Run.ID}} \\
  --context https://github.com/meu/repo.git \\
  --file Dockerfile \\
  --base-image-trigger-enabled true

# Dar permissão para Container App puxar imagens (sem senha)
az role assignment create \\
  --role AcrPull \\
  --scope $(az acr show --name meuacr --query id -o tsv) \\
  --assignee $CONTAINER_APP_PRINCIPAL_ID`,lang:"bash"}
],
analogy:"ACR está para Docker Hub assim como um repositório privado do GitHub está para o GitHub público. Você controla quem acessa, revoga acesso, audita pulls — tudo dentro da sua conta.",
tactic:"Crie um ACR gratuito e faça az acr build de uma API Node.js simples. Em 10 minutos você entende o fluxo. Depois configure uma task com base image trigger e observe o rebuild automático.",tacticColor:"b",
whenuse:{"yes": ["Você precisa de um registry Docker privado dentro da sua assinatura Azure", "Imagens precisam ser reconstruídas automaticamente quando a imagem base recebe patch de segurança", "Container Apps, AKS ou App Service precisam puxar imagens sem credenciais hardcoded", "Você tem apps em múltiplas regiões e quer pull rápido com geo-replication"], "no": ["Sua imagem já está no Docker Hub público e não há requisito de privacidade", "Você está apenas fazendo testes locais sem deploy no Azure"]},
  usecases:[{company:"Netflix",scenario:"Rebuild automático de imagens de microsserviços",desc:"Quando o time de segurança atualiza a imagem base Ubuntu, uma ACR Task reconstrói automaticamente todas as +200 imagens de serviços sem intervenção manual. Zero imagens com CVEs não corrigidos em produção.",badge:"base image trigger"},
  {company:"Banco Itaú (exemplo)",scenario:"Pipeline de CI sem servidor de build dedicado",desc:"Ao invés de manter servidores Jenkins, o push no GitHub dispara uma ACR Task que builda e publica a imagem. Reduz custo de infra de CI e elimina gargalo de build em horário de pico.",badge:"git commit trigger"},
  {company:"Startup SaaS",scenario:"Registry privado multi-região com pull rápido",desc:"Container Apps no Brasil e na Europa puxam imagens do ACR com geo-replication. O pull vem da réplica mais próxima — latência de 200ms vs 2s sem geo-replication.",badge:"sku premium"}],
questions:[
{q:"Sua equipe precisa que as imagens sejam reconstruídas automaticamente quando a imagem base do Node.js recebe um patch de segurança. Qual recurso do ACR usar?",a:"ACR Task com base image update trigger.",why:"Webhook notifica sistemas quando UMA imagem é publicada (saída). Base image trigger reage à atualização da imagem pai (entrada). Direções opostas."},
{q:"Um dev quer fazer build de uma imagem sem ter Docker instalado localmente. Qual comando?",a:"az acr build --registry meuacr --image app:v1 . — envia o contexto para o Azure e o ACR faz o build na nuvem.",why:null},
{q:"Container Apps em 3 regiões precisam puxar imagens com latência mínima. Qual SKU e feature do ACR?",a:"SKU Premium com geo-replication. Crie réplicas nas mesmas regiões dos Container Apps. O Docker pull resolve para a réplica mais próxima automaticamente.",why:null}

{id:"t2",num:"02",domain:"containers",week:1,title:"App Service + Deploy de Containers",tag:"Containers · Semana 1",tagColor:"b",
summary:"PaaS para hospedar APIs. Foco em deploy de containers, configuração segura e deploys zero-downtime com deployment slots.",
sections:[
{title:"Deployment Slots — cai muito",content:`Slots são instâncias separadas com URL própria (ex: myapp-staging.azurewebsites.net).

Swap: troca instantânea entre slots sem downtime. O App Service aquece o slot staging (health checks, inicialização de cache) antes do swap.

Slot settings: variáveis marcadas como "slot setting" ficam presas ao slot — não viajam no swap. Use para connection strings de bancos diferentes.

Traffic splitting: enviar X% do tráfego para outro slot (A/B testing).

Rollback: se algo der errado, outro swap restaura a versão anterior em segundos.`},
{title:"App Settings com referência ao Key Vault",content:`Em vez de colar connection strings nas variáveis, você referencia o secret pelo URI do Key Vault. O App Service resolve em runtime via Managed Identity — o valor real nunca aparece em logs.

Sintaxe: @Microsoft.KeyVault(SecretUri=https://vault.vault.azure.net/secrets/nome/)`,
code:`# Criar slot staging
az webapp deployment slot create --name minha-api \\
  --resource-group rg-ai200 --slot staging

# App Setting com referência ao Key Vault
az webapp config appsettings set --name minha-api \\
  --resource-group rg-ai200 \\
  --settings "DB_URL=@Microsoft.KeyVault(SecretUri=https://vault.vault.azure.net/secrets/db-url/)"

# Marcar como slot setting (não viaja no swap!)
az webapp config appsettings set --name minha-api \\
  --resource-group rg-ai200 \\
  --slot-settings "DB_URL=@Microsoft.KeyVault(SecretUri=...)"

# Swap staging → produção (zero downtime)
az webapp deployment slot swap --name minha-api \\
  --resource-group rg-ai200 --slot staging`,lang:"bash"}
],
analogy:"Slots são como um restaurante com duas cozinhas. A cozinha A serve os clientes. A cozinha B prepara o novo cardápio. Quando tudo está pronto, você faz o swap: a B passa a servir. Se o cardápio for ruim, reverta para a A — que ainda está intacta.",
tactic:"Crie dois slots e experimente o swap. Deixe uma App Setting sem 'slot setting' de propósito e observe ela viajar no swap — isso fixa o conceito mais que qualquer leitura.",tacticColor:"b",
whenuse:{"yes": ["Você precisa de deploy zero-downtime com rollback em segundos (deployment slots)", "A connection string de produção não pode aparecer em nenhum log ou portal", "Você quer testar uma nova versão com % do tráfego antes do rollout completo", "Sua stack é uma API REST ou app web que não precisa de orquestração complexa"], "no": ["Você precisa de controle de infraestrutura (use AKS)", "Sua carga é muito variável e intermitente (considere Container Apps com scale-to-zero)", "Você precisa rodar containers side-by-side no mesmo pod"]},
  usecases:[{company:"E-commerce de moda",scenario:"Deploy de Black Friday sem janela de manutenção",desc:"A nova versão da API de checkout vai para o slot staging às 3h. Às 8h59 (1 min antes da Black Friday começar), o swap leva menos de 10 segundos. Se algo der errado, outro swap reverte em 8 segundos.",badge:"deployment slot"},
  {company:"FinTech de pagamentos",scenario:"Connection string do banco sem exposição",desc:"A string de conexão ao banco de dados (com credenciais de produção) fica no Key Vault. O App Service referencia o secret por URI. Nenhum desenvolvedor vê a senha de produção — nem no portal, nem nos logs.",badge:"key vault reference"},
  {company:"Plataforma de educação",scenario:"A/B test de nova UI de matrícula",desc:"10% do tráfego vai para o slot com a nova UI de checkout de cursos. Após 48h, a taxa de conversão subiu 12%. O swap promove a versão para 100% dos usuários em segundos.",badge:"traffic splitting"}],
questions:[
{q:"Você precisa fazer deploy de uma nova versão sem interromper usuários, com possibilidade de rollback imediato. Como?",a:"Deployment slots. Deploy no slot 'staging' → aquecimento → swap para produção. Se algo der errado, swap reverso restaura a versão anterior em segundos.",why:null},
{q:"Após um swap, o App de produção usou a connection string do banco de staging. O que aconteceu?",a:"A App Setting não estava marcada como 'slot setting'. Marque-a com --slot-settings. Assim cada slot mantém sua própria connection string.",why:null},
{q:"Como armazenar a connection string no App Service sem que fique visível no portal?",a:"App Setting com referência ao Key Vault (@Microsoft.KeyVault(SecretUri=...)). O App Service com Managed Identity resolve o valor em runtime sem expor o secret.",why:null}
]},

{id:"t3",num:"03",domain:"containers",week:2,title:"Azure Container Apps",tag:"Containers · Semana 2",tagColor:"b",
summary:"Plataforma serverless para containers. Kubernetes gerenciado — você define o container e as regras, a Microsoft gerencia o resto. O mais cobrado no domínio containers.",
sections:[
{title:"Hierarquia de conceitos",content:`Environment: agrupamento de Container Apps que compartilham rede interna e Log Analytics. Apps no mesmo environment se comunicam internamente sem sair para a internet.

Revision: snapshot imutável do app. Toda mudança de imagem ou configuração cria uma nova revision.

Replica: instância em execução de uma revision. A escala aumenta réplicas.

Revision modes:
- Single: uma revision ativa por vez. Simples.
- Multiple: várias revisions simultâneas com traffic splitting. Para blue/green e canary.

Ingress:
- External: app acessível pela internet.
- Internal: só acessível de outros apps no mesmo environment. Use para microservices privados.`,
code:`# Criar environment
az containerapp env create --name meu-env \\
  --resource-group rg-ai200 --location eastus

# Deploy com scale-to-zero
az containerapp create \\
  --name minha-api --resource-group rg-ai200 \\
  --environment meu-env \\
  --image meuacr.azurecr.io/minhaapi:v1 \\
  --target-port 3000 --ingress external \\
  --min-replicas 0 --max-replicas 10

# Multiple revisions para A/B testing
az containerapp revision set-mode \\
  --name minha-api --resource-group rg-ai200 --mode multiple

# Split de tráfego: 90% v1, 10% v2
az containerapp ingress traffic set --name minha-api \\
  --resource-group rg-ai200 \\
  --revision-weight revision-v1=90 revision-v2=10`,lang:"bash"}
],
analogy:"Container Apps está para o AKS assim como o Vercel está para um servidor EC2. Com Vercel você não gerencia nada — só define o app. Com Container Apps, você define o container e as regras. A plataforma cuida de nodes, upgrades, load balancing e networking.",
tactic:"Deploy a mesma API nos dois revision modes. Experimente traffic split 80/20. Quando você entende que revision ≠ replica, o modelo mental fica claro para todas as questões de escala.",tacticColor:"b",
whenuse:{"yes": ["APIs, workers de background e microservices sem precisar gerenciar Kubernetes", "Você quer scale-to-zero: custo zero quando não há tráfego", "Escala baseada em eventos de fila (KEDA built-in)", "Precisa de blue/green ou canary deploy simples com revision mode multiple"], "no": ["Sua app precisa de StatefulSets com armazenamento persistente (use AKS)", "Você precisa de configuração avançada de Kubernetes (CNI, DaemonSets, node pools customizados)", "Você precisa de múltiplos containers com dependências de ciclo de vida no mesmo pod"]},
  usecases:[{company:"iFood (exemplo)",scenario:"API de rastreamento de pedidos",desc:"Container App com ingress external exposta para o app mobile. minReplicas=2 garante sempre 2 instâncias. A API de restaurantes é ingress internal — só acessível internamente, nunca exposta para a internet.",badge:"ingress internal/external"},
  {company:"Empresa de logística",scenario:"Blue/green deploy de sistema de roteirização",desc:"Nova versão do algoritmo de roteirização vai para revision-v2 com 5% do tráfego. Após validação por 2h sem erros, o traffic split muda para 100% na v2. Zero downtime, rollback em 1 clique.",badge:"multiple revisions"},
  {company:"Plataforma de analytics",scenario:"Workers de processamento de eventos",desc:"Container App com minReplicas=0 processa eventos de cliques. Às 2h da manhã não há tráfego — zero instâncias, custo zero. Às 9h com pico de usuários, escala automaticamente para 8 instâncias.",badge:"scale-to-zero"}],
questions:[
{q:"Qual é a diferença entre uma revision e uma replica no Azure Container Apps?",a:"Revision = versão imutável do app (nova imagem ou config cria nova revision). Replica = instância em execução de uma revision. Uma revision pode ter 0 a N réplicas.",why:null},
{q:"Você quer testar uma nova versão com 5% dos usuários antes do rollout completo. O que configurar?",a:"Revision mode: multiple + traffic splitting. Ativar multiple mode, fazer deploy da nova revision, configurar 95% para a revision antiga e 5% para a nova.",why:null},
{q:"Dois microservices precisam se comunicar sem exposição para a internet. Como?",a:"Ingress internal em ambos. Apps no mesmo environment se comunicam pelo nome do app (http://nome-do-app) via DNS interno.",why:null}
]},

{id:"t4",num:"04",domain:"containers",week:2,title:"KEDA — Kubernetes Event-driven Autoscaling",tag:"Containers · Semana 2",tagColor:"b",
summary:"Autoscaling baseado em eventos, não em CPU. Escala pelo número de mensagens na fila, lag de streaming, ou qualquer métrica externa. Built-in no Container Apps.",
sections:[
{title:"Por que KEDA existe e como funciona",content:`O problema do autoscaling por CPU: um worker de embeddings processa uma fila do Service Bus. A fila tem 5.000 mensagens. O worker aguarda I/O (chamada ao OpenAI, write no banco) — CPU em 8%. O autoscaler tradicional não escalaria. A fila continua crescendo.

Com KEDA: "crie 1 réplica para cada 10 mensagens na fila". 5.000 mensagens → 500 réplicas (até o máximo). Fila vazia → 0 réplicas (scale-to-zero, custo zero).

Scalers disponíveis (60+):
- azure-servicebus: pelo número de mensagens. O mais comum em pipelines de AI.
- azure-eventhubs: pelo lag de consumo.
- redis: pelo comprimento de uma lista.
- postgresql: por resultado de uma query SQL.
- cron: por horário (9h–18h = 5 réplicas, resto = 0).
- http: por requests HTTP concorrentes.`,
code:`# KEDA scale rule por Service Bus
az containerapp update \\
  --name meu-worker --resource-group rg-ai200 \\
  --min-replicas 0 --max-replicas 20 \\
  --scale-rule-name sb-rule \\
  --scale-rule-type azure-servicebus \\
  --scale-rule-metadata queueName=ai-jobs messageCount=5 \\
  --scale-rule-auth connection=servicebus-secret

# Lógica: ceil(mensagens / messageCount) = réplicas
# 47 msgs / 5 = ceil(9.4) = 10 réplicas
# Fila vazia = 0 réplicas (scale-to-zero = custo zero)`,lang:"bash"}
],
analogy:"KEDA é o sistema de chamada de um supermercado. Não importa o quanto os caixas estão 'ocupados' (CPU) — o que importa é o tamanho da fila de clientes. Mais de 10 clientes por caixa → abre mais um caixa. Loja fechada e fila vazia → todos os caixas fecham.",
tactic:"Suba um Container App com minReplicas=0 e um KEDA scaler de Service Bus. Envie 50 mensagens via CLI e observe as réplicas sendo criadas no portal. Ver a escala acontecer ao vivo é inesquecível.",tacticColor:"b",
whenuse:{"yes": ["O workload escala por eventos, não por CPU (fila, mensagens, lag de streaming)", "O volume é imprevisível e você quer custo zero quando ocioso (minReplicas=0)", "Workers de AI que processam jobs do Service Bus, Event Hubs ou Redis", "Você quer escalar automaticamente de 0 a centenas de instâncias sem configuração manual"], "no": ["A carga é previsível e constante — KEDA adiciona complexidade desnecessária", "Você precisa de escala por CPU/memória — o HPA nativo do Kubernetes é suficiente", "O processamento é síncrono e orientado a requests HTTP (use apenas HTTP scaler ou HPA)"]},
  usecases:[{company:"Empresa de AI generativa",scenario:"Geração de embeddings em batch",desc:"Quando um cliente faz upload de 10.000 documentos para indexação, a fila do Service Bus enche. O KEDA scaler azure-servicebus cria 50 workers de embedding em paralelo. Após processar tudo, volta a zero. Custo: pago pelo tempo de processamento real, não por capacidade ociosa 24/7.",badge:"azure-servicebus scaler"},
  {company:"Plataforma de e-learning",scenario:"Processamento de vídeos no horário comercial",desc:"Workers de transcrição de vídeo precisam estar disponíveis apenas das 9h às 18h. O KEDA cron scaler mantém 3 instâncias durante o dia e as desliga à noite. Economia de 58% comparado a instâncias 24/7.",badge:"cron scaler"},
  {company:"Sistema de pedidos online",scenario:"Escala por comprimento de fila Redis",desc:"Fila Redis acumula pedidos de personalização de produto. O KEDA redis scaler cria 1 worker por 5 pedidos na fila. Pico de 200 pedidos simultâneos → 40 workers criados automaticamente em ~20 segundos.",badge:"redis scaler"}],
questions:[
{q:"Você processa jobs de embedding de uma fila do Service Bus. O volume varia de 0 a 10.000 jobs/dia de forma imprevisível. Como implementar de forma custo-eficiente?",a:"Azure Container Apps com KEDA scaler do tipo azure-servicebus e minReplicas=0. Com scale-to-zero você paga zero quando a fila está vazia. maxReplicas define o teto de custo.",why:"CPU estaria baixo mesmo com fila cheia (worker aguarda I/O). KEDA escala pelo que realmente importa."},
{q:"Com minReplicas=0 e messageCount=5, quantas réplicas são criadas quando a fila tem 47 mensagens?",a:"ceil(47/5) = 10 réplicas. KEDA calcula: desiredReplicas = ceil(mensagens / targetPorReplica).",why:null},
{q:"Você quer que um worker seja ativado apenas durante o horário comercial (9h–18h, seg–sex). Qual KEDA scaler?",a:"KEDA cron scaler. Defina schedule CRON para escalar para N réplicas às 9h e voltar a 0 às 18h nos dias úteis.",why:null}
]},

{id:"t5",num:"05",domain:"containers",week:2,title:"AKS — Azure Kubernetes Service",tag:"Containers · Semana 2",tagColor:"b",
summary:"Kubernetes gerenciado com controle total. Na AI-200 o foco é deploy via manifests e troubleshooting básico.",
sections:[
{title:"Conceitos e troubleshooting",content:`Pod: menor unidade deployável. Um ou mais containers que compartilham rede e storage. Pods são efêmeros.

Deployment: declara o estado desejado (3 réplicas desta imagem). O Kubernetes reconcilia continuamente.

Service: expõe pods como endpoint estável. ClusterIP (interno), LoadBalancer (IP público), NodePort.

Troubleshooting — comandos cobrados no exame:
- kubectl get pods → lista pods e status (Running, Pending, CrashLoopBackOff)
- kubectl logs pod-name --previous → logs do container que crashou antes de reiniciar
- kubectl describe pod pod-name → eventos do pod, motivo de falha
- kubectl get events --sort-by=.lastTimestamp → todos os eventos em ordem`}
],
table:{headers:["Critério","Container Apps","AKS"],rows:[
["Gerenciamento","Serverless — Microsoft gerencia","Você gerencia nodes e config"],
["Scale-to-zero","✓ Nativo","Requer config extra"],
["KEDA","✓ Built-in","Instalar separado"],
["StatefulSets","Não","Sim"],
["Quando usar","APIs, workers, microservices","Workloads complexas, controle total"]
]},
analogy:null,
tactic:"Crie um cluster AKS gratuito, escreva um deployment.yaml e faça deploy. Intencionalmente coloque uma imagem errada e use kubectl describe para ver o erro ImagePullBackOff. Troubleshooting ao vivo é memorável.",tacticColor:"b",
whenuse:{"yes": ["Você precisa de StatefulSets (bancos de dados em containers, Kafka, ZooKeeper)", "Workloads que exigem controle total: CNI plugins, node pools com GPU, DaemonSets", "Quando Container Apps não suporta o que você precisa (sidecar patterns complexos, init containers avançados)", "Times com expertise em Kubernetes que já operam clusters"], "no": ["Apps simples de API, workers e microservices (use Container Apps — mais simples)", "Você não quer gerenciar upgrades de node pool e patches de segurança", "Seu time não tem expertise em Kubernetes — a curva de aprendizado é alta"]},
  usecases:[{company:"Banco Central (exemplo)",scenario:"Workloads com StatefulSets",desc:"Sistema de processamento de transações usa PostgreSQL em pods StatefulSets no AKS — com armazenamento persistente e identidade de pod estável. Container Apps não suporta StatefulSets. AKS é a única opção aqui.",badge:"statefulsets"},
  {company:"Empresa de ML",scenario:"Jobs de treinamento com GPUs customizadas",desc:"Treinamento de modelos exige node pools com GPUs A100, configuração específica de CPU/memória e tolerations Kubernetes customizados. AKS permite esse nível de controle que Container Apps não oferece.",badge:"controle total"},
  {company:"Startup de microservices",scenario:"Troubleshooting de pod em CrashLoopBackOff",desc:"API Node.js entra em CrashLoopBackOff em produção às 3h. O dev usa kubectl logs --previous para ver a mensagem de erro da execução anterior e kubectl describe pod para ver o evento 'OOMKilled' — pod estava extrapolando o limite de memória.",badge:"kubectl troubleshoot"}],
questions:[
{q:"Um pod está em CrashLoopBackOff. O container reinicia imediatamente. Como ver o motivo?",a:"kubectl logs nome-do-pod --previous para ver os logs da execução anterior. Combine com kubectl describe pod para ver o exit code e eventos.",why:null},
{q:"Quando escolher AKS em vez de Container Apps?",a:"Quando você precisa de: controle total sobre o cluster, StatefulSets, DaemonSets, networking customizado (CNI plugins), ou workloads que o Container Apps não suporta.",why:null}
]},

// ─── AI DATA ───
{id:"t6",num:"06",domain:"data",week:3,title:"Azure Cosmos DB for NoSQL",tag:"AI Data · Semana 3",tagColor:"p",
summary:"Banco NoSQL distribuído globalmente. O maior domínio individual da AI-200 (25–30%). Agora com vector search nativo.",
sections:[
{title:"Modelo de dados e Partition Key",content:`Hierarquia: Account → Database → Container → Item.

Item: documento JSON com campos id (string, obrigatório) e o valor da partition key.

Partition Key: distribui dados entre partições físicas. Imutável após a criação. Boa partition key: alta cardinalidade, distribuição uniforme, aparece em 90% dos filtros WHERE. Exemplos: userId, tenantId.

Má partition key: baixa cardinalidade (ex: status = "ativo/inativo") → hotspot.

Cross-partition query: sem filtrar pela partition key, faz fan-out para todas as partições → muito mais RUs.`},
{title:"Indexing Policy",content:`Por padrão, todos os campos são indexados. Ótimo para flexibilidade, caro para writes pesados.

includedPaths: indexar apenas campos filtrados em queries.
excludedPaths: excluir campos grandes nunca filtrados (ex: /rawContent/*).
vectorIndexes: para campos de embedding. Tipo: diskANN.`,
code:`import { CosmosClient } from "@azure/cosmos";
import { DefaultAzureCredential } from "@azure/identity";

const client = new CosmosClient({
  endpoint: process.env.COSMOS_ENDPOINT!,
  aadCredentials: new DefaultAzureCredential() // sem senha!
});

const { container } = await client.database("ai-db")
  .containers.createIfNotExists({
    id: "docs",
    partitionKey: { paths: ["/category"] },
    indexingPolicy: {
      includedPaths: [{ path: "/category/?" }, { path: "/title/?" }],
      excludedPaths: [{ path: "/rawContent/*" }], // texto grande, não filtrado
      vectorIndexes: [{ path: "/embedding", type: "diskANN" }]
    },
    vectorEmbeddingPolicy: {
      vectorEmbeddings: [{
        path: "/embedding", dataType: "float32",
        distanceFunction: "cosine", dimensions: 1536
      }]
    }
  });`,lang:"typescript"}
],
analogy:"Você já usa MongoDB — os conceitos são análogos. A principal diferença: no Cosmos DB você declara a partition key na criação e ela é imutável. Além disso, o Cosmos DB cobra em RUs (abstração de CPU+IO+memória), não em operações diretas.",
tactic:"Crie dois containers: um com política padrão e outro com includedPaths/excludedPaths otimizados. Insira 100 documentos e compare o consumo de RUs. Números reais fixam o conceito.",tacticColor:"p",
whenuse:{"yes": ["Você precisa de escala global com latência < 10ms em qualquer região", "Dados são documentos JSON com schema flexível ou variável", "Você precisa de vector search junto com dados JSON no mesmo container", "Alta taxa de writes com partition key bem definida (ex: userId, tenantId)"], "no": ["Você precisa de JOINs complexos entre entidades (use PostgreSQL)", "Seu schema é fortemente relacional com integridade referencial (use PostgreSQL ou SQL)", "Você já tem dados no PostgreSQL e quer apenas adicionar vector search (use pgvector)", "Seu dataset é pequeno e não precisa de escala global"]},
  usecases:[{company:"Plataforma de streaming",scenario:"Catálogo de filmes e séries com buscas flexíveis",desc:"Container 'catalog' com partition key=/genre. Queries por gênero são sempre within-partition. O campo 'description' (texto longo) está em excludedPaths — reduz 40% do custo de write. O campo 'title' está em includedPaths para busca rápida.",badge:"indexing policy"},
  {company:"App de delivery",scenario:"Histórico de pedidos por usuário",desc:"Container 'orders' com partition key=/userId. Toda query 'buscar pedidos do usuário X' filtra por userId — sempre within-partition. Sem cross-partition queries. O sistema suporta 10M de usuários com latência < 10ms.",badge:"partition key"},
  {company:"Sistema de assistente AI",scenario:"Documentos com embeddings para RAG",desc:"Container 'documents' com vectorEmbeddingPolicy (diskANN, cosine, 1536 dims). O campo /rawContent está em excludedPaths. Busca semântica via VectorDistance() retorna os chunks mais relevantes para o prompt do usuário.",badge:"vector search"}],
questions:[
{q:"Queries consomem 500 RUs mas deveriam ser ~10. O campo 'category' está nos filtros WHERE mas não está indexado. Como corrigir?",a:"Adicionar /category/? ao includedPaths da indexing policy. Sem índice, o Cosmos DB faz full scan da partição para cada query com esse filtro.",why:null},
{q:"Um campo 'rawContent' contém textos de 50KB e nunca é filtrado. O que fazer para reduzir writes?",a:"Adicionar /rawContent/* ao excludedPaths. Isso impede a indexação do campo, reduzindo significativamente o custo de RUs em insert e update.",why:null},
{q:"Você precisa armazenar embeddings de 1536 dimensões e executar busca de similaridade. O que adicionar ao indexing policy?",a:"vectorIndexes com type diskANN para o path do campo de embedding, e vectorEmbeddingPolicy declarando dataType: float32, distanceFunction: cosine, dimensions: 1536.",why:null}
]},

{title:"Os 5 níveis",content:`Em um banco replicado em 3 regiões, quando você escreve em São Paulo, quanto tempo leva para Tóquio ver esse write? Depende do nível de consistência escolhido.`}
],

whenuse:{"tip": true, "items": ["<strong>Strong</strong>: dados financeiros, saldo de conta, inventário crítico — qualquer usuário em qualquer região precisa ver o write mais recente imediatamente. Custo: 2× em RUs.", "<strong>Session (padrão)</strong>: e-commerce, redes sociais, perfis, chats — o usuário precisa ver suas próprias escritas, mas outros podem ter atraso aceitável. Cobre 90% dos casos.", "<strong>Bounded Staleness</strong>: quando você tem um SLA definido de frescor dos dados (ex: máximo 30 segundos de atraso entre regiões). Raro na prática.", "<strong>Consistent Prefix</strong>: feeds de atividade, timelines, logs de eventos — a ordem importa, mas atraso é aceitável.", "<strong>Eventual</strong>: contadores de views, curtidas, scores aproximados — pequenas imprecisões são aceitáveis e custo mínimo é prioritário."]},
  usecases:[{company:"Banco digital",scenario:"Saldo de conta bancária",desc:"Consistency level: Strong. Quando um saque é feito, qualquer ATM ou app, em qualquer região do mundo, deve ver o saldo atualizado imediatamente. Sem Strong, um usuário poderia sacar dinheiro duas vezes em ATMs de regiões diferentes antes da sincronização.",badge:"strong"},

  {company:"Sistema de recomendação",scenario:"Contador de views de vídeos",desc:"Consistency level: Eventual. O contador de 'visualizações' pode ter alguns segundos de atraso e pequenas imprecisões entre regiões. Usuários não percebem a diferença entre '1.234.567' e '1.234.589' views. Custo mínimo, latência mínima.",badge:"eventual"}],
questions:[
{q:"Um usuário atualiza seu perfil e clica em 'ver perfil'. Precisa ver as mudanças. Qual consistency level?",a:"Session. Garante read-your-writes dentro da mesma sessão. O usuário sempre vê suas próprias escritas.",why:null},
{q:"Sistema bancário: qualquer agência, em qualquer país, precisa ver o saldo atualizado imediatamente após saque. Qual level?",a:"Strong. Garante que toda leitura, em qualquer região, retorna o write mais recente. Custo: 2× em RUs.",why:null},
{q:"Contador de 'curtidas'. Pequenas imprecisões são aceitáveis e o custo precisa ser mínimo. Qual level?",a:"Eventual. Para contadores aproximados, eventual oferece mínima latência e mínimo custo em RUs.",why:null},
