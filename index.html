const DOMAIN_ORDER = [
  {domain:"containers",label:"Domínio 1 — Containerized Solutions (20–25%)"},
  {domain:"data",label:"Domínio 2 — AI Data Management Services (25–30%)"},
  {domain:"messaging",label:"Domínio 3 — Connect & Consume Azure Services (20–25%)"},
  {domain:"security",label:"Domínio 4 — Secure, Monitor & Troubleshoot (20–25%)"},
  {domain:"observability",label:"Domínio 4 (cont.) — Monitor & Troubleshoot"},
];
const DOMAIN_COLORS = {containers:"#5b8fff",data:"#a78bfa",messaging:"#34d399",security:"#fbbf24",observability:"#fbbf24"};
const TACTIC_STYLES = {
  b:{border:"#5b8fff",label:"#5b8fff",bg:"rgba(91,143,255,.06)"},
  p:{border:"#a78bfa",label:"#a78bfa",bg:"rgba(167,139,250,.06)"},
  g:{border:"#34d399",label:"#34d399",bg:"rgba(52,211,153,.05)"},

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let doneSet = new Set(JSON.parse(localStorage.getItem("ai200_done")||"[]"));
let activeId = "t1";

function saveDone(){ localStorage.setItem("ai200_done", JSON.stringify([...doneSet])); }

function updateProgress(){
  const n = doneSet.size, total = TOPICS.length, pct = Math.round(n/total*100);
  document.getElementById("progFill").style.width = pct+"%";
  document.getElementById("progTxt").textContent = n+" / "+total+" · "+pct+"%";
}

function toggleDone(id){
  doneSet.has(id) ? doneSet.delete(id) : doneSet.add(id);
  saveDone(); updateProgress();
  const btn = document.getElementById("done-"+id);
  if(btn){ btn.className = "done-btn"+(doneSet.has(id)?" done":""); btn.textContent = doneSet.has(id)?"✓":"○"; }
  const si = document.getElementById("si-"+id);
  if(si){ const chk = si.querySelector(".sb-chk"); if(chk){ chk.className="sb-chk"+(doneSet.has(id)?" done":""); chk.textContent=doneSet.has(id)?"✓":""; }}
}

function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }

function filterSidebar(q){
  q = q.toLowerCase();
  document.querySelectorAll(".sb-item").forEach(el=>{
    const txt = el.getAttribute("data-title")||"";
    el.style.display = (!q || txt.toLowerCase().includes(q)) ? "flex" : "none";
  });
  document.querySelectorAll(".sb-grp").forEach(grp=>{
    let sib=grp.nextElementSibling, has=false;
    while(sib&&!sib.classList.contains("sb-grp")){
      if(sib.style.display!=="none") has=true;
      sib=sib.nextElementSibling;
    }
    grp.style.display = has?"flex":"none";
  });
}

function toggleQ(btn){
  const q = btn.closest(".question");
  const ans = q.querySelector(".q-ans");
  const arr = q.querySelector(".q-arr");
  const open = ans.style.display==="block";
  ans.style.display = open?"none":"block";
  arr.style.transform = open?"rotate(0)":"rotate(180deg)";
}

function copyCode(btn){
  const pre = btn.closest(".code-wrap").querySelector("pre");
  navigator.clipboard?.writeText(pre.textContent);
  btn.textContent="✓ copiado";
  setTimeout(()=>{ btn.textContent="copiar"; },2000);
}

// ═══════════════════════════════════════════
// RENDER SIDEBAR
// ═══════════════════════════════════════════
function renderSidebar(){
  const body = document.getElementById("sbBody");
  let html="";
  const groups = {containers:"Containers",data:"AI Data Management",messaging:"Mensageria & Functions",security:"Segurança",observability:"Observabilidade"};
  const domColors = DOMAIN_COLORS;
  let prevDomain="";
  TOPICS.forEach(t=>{
    if(t.domain!==prevDomain){
      html+=`<div class="sb-grp"><span>${groups[t.domain]}</span></div>`;
      prevDomain=t.domain;
    }
    const c = domColors[t.domain]||"#5b8fff";
    html+=`<a class="sb-item${t.id===activeId?" active":""}" id="si-${t.id}" data-title="${t.title}" onclick="goTo('${t.id}')">
      <span class="sb-chk${doneSet.has(t.id)?" done":""}" onclick="event.stopPropagation();toggleDone('${t.id}')">${doneSet.has(t.id)?"✓":""}</span>
      <span class="sb-num">${t.num}</span>
      <span class="sb-dot" style="background:${c}"></span>
      <span>${t.title}</span>
    </a>`;
  });
  body.innerHTML=html;
}

// ═══════════════════════════════════════════
// RENDER TOPIC
// ═══════════════════════════════════════════
function renderTopic(t){
  const tc = {b:"tag-b",p:"tag-p",g:"tag-g",y:"tag-y"}[t.tagColor]||"tag-b";
  const ts = TACTIC_STYLES[t.tacticColor]||TACTIC_STYLES.b;

  let sectionsHtml="";
  (t.sections||[]).forEach(sec=>{
    sectionsHtml+=`<div class="blk-t">${sec.title}</div>
    <div class="cb"><p>${sec.content.replace(/\n/g,"<br>")}</p></div>`;
    if(sec.code){
      sectionsHtml+=`<div class="code-wrap">
        <div class="code-head">
          <span class="code-lbl">${sec.lang||"code"}</span>
          <div class="code-dots">
            <div class="code-dot" style="background:#f87171"></div>
            <div class="code-dot" style="background:#fbbf24"></div>
            <div class="code-dot" style="background:#34d399"></div>
          </div>
          <button class="copy-btn" onclick="copyCode(this)">copiar</button>
        </div>
        <pre>${escHtml(sec.code)}</pre>
      </div>`;
    }
  });

  let tableHtml="";
  if(t.table){
    const {headers,rows}=t.table;
    tableHtml=`<div class="tw"><table>
      <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="color:var(--t);font-weight:600"':''}>${c}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  }

  let analogyHtml="";
  if(t.analogy){
    analogyHtml=`<div class="analogy"><div class="al">🧠 Analogia para fixar</div><p>${t.analogy}</p></div>`;
  }

  let tacticHtml="";
  if(t.tactic){
    tacticHtml=`<div class="tactic" style="background:${ts.bg};border:1px solid ${ts.border}33;border-left-color:${ts.border};">
      <div class="tl" style="color:${ts.label};font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:6px;">🎯 Tática de aprendizado</div>
      <p>${t.tactic}</p>
    </div>`;
  }

  let wuHtml="";
  if(t.whenuse){
    const wuc = t.tagColor||"b";
    const wuStyle = {
      b:{c:"var(--a)",bg:"rgba(91,143,255,.06)",bor:"rgba(91,143,255,.18)"},
      p:{c:"var(--a2)",bg:"rgba(167,139,250,.06)",bor:"rgba(167,139,250,.18)"},
      g:{c:"var(--a3)",bg:"rgba(52,211,153,.05)",bor:"rgba(52,211,153,.18)"},
      y:{c:"var(--w)",bg:"rgba(251,191,36,.05)",bor:"rgba(251,191,36,.18)"}
    }[wuc]||{c:"var(--a)",bg:"rgba(91,143,255,.06)",bor:"rgba(91,143,255,.18)"};

    if(t.whenuse.tip){
      const items = (t.whenuse.items||[]).map(item=>`<li>${item}</li>`).join("");
      wuHtml=`<div class="blk-t">Quando usar?</div>
      <div class="wu-single" style="background:${wuStyle.bg};border:1px solid ${wuStyle.bor};">
        <ul class="wu-list" style="--marker-color:${wuStyle.c}">${items}</ul>
      </div>`;
    } else {
      const yesItems = (t.whenuse.yes||[]).map(i=>`<li>${i}</li>`).join("");
      const noItems  = (t.whenuse.no||[]).map(i=>`<li>${i}</li>`).join("");
      wuHtml=`<div class="blk-t">Quando usar?</div>
      <div class="wu-cols">
        <div class="wu-col wu-yes">
          <div class="wu-col-title">✓ Use quando</div>
          <ul class="wu-list">${yesItems}</ul>
        </div>
        <div class="wu-col wu-no">
          <div class="wu-col-title">✗ Evite quando</div>
          <ul class="wu-list">${noItems}</ul>
        </div>
      </div>`;
    }
  }

  let ucHtml="";
  if(t.usecases&&t.usecases.length){
    const ucColor=t.tagColor||"b";
    const ucItems=t.usecases.map(u=>`
      <div class="uc-card uc-${ucColor}">
        <div class="uc-company">${u.company}</div>
        <div class="uc-scenario">${u.scenario}</div>
        <div class="uc-desc">${u.desc}</div>
        <span class="uc-badge">${u.badge}</span>
      </div>`).join("");
    ucHtml=`<div class="blk-t">Casos de uso reais</div><div class="uc-grid">${ucItems}</div>`;
  }

  let questionsHtml="";
  if(t.questions&&t.questions.length){
    const qItems=t.questions.map((q,i)=>`
      <div class="question">
        <button class="q-btn" onclick="toggleQ(this)">
          <span class="q-n">Q${i+1}</span>
          <span class="q-text">${q.q}</span>
          <span class="q-arr">▼</span>
        </button>
        <div class="q-ans">
          <div class="q-ans-box">
            <div class="q-ans-lbl">✓ Resposta correta</div>
            <div class="q-ans-txt">${q.a.replace(/`([^`]+)`/g,'<code style="background:var(--cb);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:10px">$1</code>')}</div>
            ${q.why?`<div class="q-why">${q.why}</div>`:""}
          </div>
        </div>
      </div>`).join("");
    questionsHtml=`<div class="qs">
      <div class="qs-head"><span class="qs-lbl">🎯 Questões do exame</span><span class="qs-badge">${t.questions.length} questões</span></div>
      ${qItems}
    </div>`;
  }

  return `<div class="topic" id="${t.id}">
    <div class="topic-top">
      <div class="topic-num">${t.num}</div>
      <div class="topic-meta">
        <div class="topic-tag ${tc}">${t.tag}</div>
        <h2>${t.title}</h2>
        <p class="topic-sum">${t.summary}</p>
      </div>
      <button class="done-btn${doneSet.has(t.id)?" done":""}" id="done-${t.id}" onclick="toggleDone('${t.id}')" title="${doneSet.has(t.id)?"Marcar como não feito":"Marcar como feito"}">${doneSet.has(t.id)?"✓":"○"}</button>
    </div>
    ${sectionsHtml}${tableHtml}${analogyHtml}${wuHtml}${ucHtml}${tacticHtml}${questionsHtml}
  </div>`;
}

function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// SCROLL SPY
// ═══════════════════════════════════════════
function initScrollSpy(){
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        activeId=e.target.id;
        document.querySelectorAll(".sb-item").forEach(el=>el.classList.remove("active"));
        const si=document.getElementById("si-"+activeId);
        if(si){ si.classList.add("active"); si.scrollIntoView({block:"nearest"}); }
      }
    });
  },{rootMargin:"-15% 0px -75% 0px"});
  TOPICS.forEach(t=>{ const el=document.getElementById(t.id); if(el) obs.observe(el); });
}

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('sb-toggle');
  const ov = document.getElementById('sb-overlay');
  const isOpen = sb.classList.contains('open');
  sb.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
  ov.classList.toggle('open', !isOpen);
  document.body.style.overflow = isOpen ? '' : 'hidden';
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-toggle').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
// Fecha sidebar ao clicar num link (mobile)
document.addEventListener('click', function(e){
  const item = e.target.closest('.sb-item');
  if(item && window.innerWidth <= 760) closeSidebar();
});
// Fecha sidebar ao redimensionar para desktop
window.addEventListener('resize', function(){
  if(window.innerWidth > 760) closeSidebar();
});
